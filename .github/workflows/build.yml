          cat > 'app/src/main/java/com/meraassistant/WakeService.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.KeyguardManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.media.AudioManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer

          /**
           * 🎙️ "Hello Chinu" mode:
           * background में लगातार सुनता है। "Chinu" सुनते ही Chinu खुलकर जवाब देता है,
           * चाहे screen बंद हो या phone lock हो।
           */
          class WakeService : Service(), RecognitionListener {

              private var recognizer: SpeechRecognizer? = null
              private val handler = Handler(Looper.getMainLooper())
              private var wakeLock: PowerManager.WakeLock? = null
              private var errors = 0
              private var lastWake = 0L
              private var mutedMusic = false

              private val listenRunnable = Runnable { listen() }
              private val unmuteRunnable = Runnable { unmute() }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  if (!startInForeground()) return
                  wakeLock = (getSystemService(POWER_SERVICE) as PowerManager)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "chinu:wake")
                      .apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this).also {
                          it.setRecognitionListener(this)
                      }
                      scheduleListen(800)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      getSharedPreferences("settings", MODE_PRIVATE).edit().putBoolean("wake", false).apply()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  instance = null
                  handler.removeCallbacksAndMessages(null)
                  unmute()
                  try {
                      recognizer?.destroy()
                  } catch (e: Exception) {
                  }
                  recognizer = null
                  try {
                      wakeLock?.release()
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              // ---------------- Notification (हमेशा दिखेगा, Android का नियम) ----------------
              private fun startInForeground(): Boolean {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Hello Chinu", NotificationManager.IMPORTANCE_LOW)
                  )
                  val open = PendingIntent.getActivity(
                      this, 50, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val stop = PendingIntent.getService(
                      this, 51, Intent(this, WakeService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, CHANNEL)
                      .setSmallIcon(R.drawable.ic_mic)
                      .setContentTitle("🎙️ Chinu is listening")
                      .setContentText("Just say \"Hey Chinu\" 💖")
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(
                          Notification.Action.Builder(
                              Icon.createWithResource(this, R.drawable.ic_mic), "Turn off", stop
                          ).build()
                      )
                      .build()
                  return try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      } else {
                          startForeground(NOTIF_ID, n)
                      }
                      true
                  } catch (e: Exception) {
                      stopSelf()
                      false
                  }
              }

              // ---------------- सुनने का loop ----------------
              private fun scheduleListen(delay: Long) {
                  handler.removeCallbacks(listenRunnable)
                  handler.postDelayed(listenRunnable, delay)
              }

              private fun listen() {
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  val ttsBusy = MainActivity.speaking && System.currentTimeMillis() - MainActivity.speakingSince < 30_000
                  // Chinu खुला है, बोल रहा है, या call चल रही है, तो रुककर फिर देखें
                  if (MainActivity.visible || ChinuOverlay.active || ttsBusy ||
                      am.mode == AudioManager.MODE_IN_CALL ||
                      am.mode == AudioManager.MODE_IN_COMMUNICATION ||
                      am.mode == AudioManager.MODE_RINGTONE
                  ) {
                      scheduleListen(1500)
                      return
                  }
                  // शुरू की "beep" आवाज़ दबाने के लिए पल भर music की आवाज़ बंद (गाना न चल रहा हो तो)
                  if (!am.isMusicActive) {
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, 0)
                      mutedMusic = true
                      handler.removeCallbacks(unmuteRunnable)
                      handler.postDelayed(unmuteRunnable, 700)
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayOf("en-IN"))
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                      putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, packageName)
                  }
                  try {
                      recognizer?.cancel()
                      recognizer?.startListening(intent)
                  } catch (e: Exception) {
                      scheduleListen(3000)
                  }
              }

              private fun unmute() {
                  if (!mutedMusic) return
                  mutedMusic = false
                  val am = getSystemService(AUDIO_SERVICE) as AudioManager
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, 0)
              }

              private fun hasWake(text: String): Boolean {
                  val t = text.lowercase()
                  return WAKE_WORDS.any { t.contains(it) }
              }

              /** "hello chinu time kya hai" -> "time kya hai" */
              private fun commandAfterWake(text: String): String {
                  val t = text.lowercase()
                  var end = -1
                  for (w in WAKE_WORDS) {
                      val i = t.indexOf(w)
                      if (i >= 0) end = maxOf(end, i + w.length)
                  }
                  if (end < 0) return ""
                  return t.substring(end).trim().trimStart(',', '.', '!', '?', '।', ' ').trim()
              }

              private fun wake(command: String) {
                  unmute()
                  // Screen ON + unlocked: Siri jaisa overlay, app khole bina
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  val km = getSystemService(KEYGUARD_SERVICE) as KeyguardManager
                  val acc = AssistantService.instance
                  if (pm.isInteractive && !km.isKeyguardLocked && acc != null) {
                      acc.showOverlay(command)
                      return
                  }
                  // Screen OFF / locked: Chinu lock screen ke upar khulti hai
                  val i = Intent(this, MainActivity::class.java)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      .putExtra(EXTRA_WAKE, true)
                      .putExtra(EXTRA_COMMAND, command)
                  unmute()
                  try {
                      startActivity(i)
                  } catch (e: Exception) {
                  }
                  // अगर Android ने app सीधे नहीं खुलने दिया, तो notification से खुलवाएँ
                  handler.postDelayed({ if (!MainActivity.visible) showWakeNotification(i) }, 1500)
              }

              private fun showWakeNotification(i: Intent) {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(ALERT_CHANNEL, "Chinu replies", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 52, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(this, ALERT_CHANNEL)
                      .setSmallIcon(R.drawable.ic_mic)
                      .setContentTitle("💖 Haan, bolo?")
                      .setContentText("Tap to talk to Chinu")
                      .setContentIntent(pi)
                      .setFullScreenIntent(pi, true)
                      .setAutoCancel(true)
                      .setCategory(Notification.CATEGORY_CALL)
                      .build()
                  try {
                      nm.notify(NOTIF_ID + 1, n)
                  } catch (e: Exception) {
                  }
              }

              // ---------------- RecognitionListener ----------------
              override fun onReadyForSpeech(params: Bundle?) {}
              override fun onBeginningOfSpeech() {}
              override fun onRmsChanged(rmsdB: Float) {}
              override fun onBufferReceived(buffer: ByteArray?) {}
              override fun onEndOfSpeech() {}
              override fun onPartialResults(partialResults: Bundle?) {}
              override fun onEvent(eventType: Int, params: Bundle?) {}

              override fun onResults(results: Bundle?) {
                  errors = 0
                  val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
                  val hit = list.firstOrNull { hasWake(it) }
                  val now = System.currentTimeMillis()
                  if (hit != null && now - lastWake > 3000) {
                      lastWake = now
                      wake(commandAfterWake(hit))
                  }
                  scheduleListen(300)
              }

              override fun onError(error: Int) {
                  val delay = when (error) {
                      SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> {
                          errors = 0
                          150L
                      }
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> 1000L
                      else -> {
                          errors++
                          minOf(1000L * errors, 8000L)
                      }
                  }
                  scheduleListen(delay)
              }

              /** Chinu खुलते ही background वाला सुनना रोकें (mic एक ही जगह चल सकता है) */
              fun pauseNow() {
                  handler.removeCallbacks(listenRunnable)
                  try {
                      recognizer?.cancel()
                  } catch (e: Exception) {
                  }
                  unmute()
                  scheduleListen(1500)
              }

              companion object {
                  private const val CHANNEL = "wake"
                  private const val ALERT_CHANNEL = "wake_alert"
                  private const val NOTIF_ID = 700
                  const val ACTION_STOP = "com.meraassistant.STOP_WAKE"
                  const val EXTRA_WAKE = "wake"
                  const val EXTRA_COMMAND = "command"

                  val WAKE_WORDS = listOf(
                      "chinu", "cheenu", "chinnu", "chinoo", "cheeno", "chenu",
                      "चीनू", "चिनू", "चिन्नू", "चीनु", "चिनु", "चीनूं", "चेनू"
                  )

                  @Volatile
                  var instance: WakeService? = null
                      private set

                  fun start(ctx: Context) {
                      try {
                          ctx.startForegroundService(Intent(ctx, WakeService::class.java))
                      } catch (e: Exception) {
                      }
                  }

                  fun stop(ctx: Context) {
                      ctx.stopService(Intent(ctx, WakeService::class.java))
                  }

                  fun pause() {
                      instance?.pauseNow()
                  }
              }
          }
