          cat > 'app/src/main/java/com/meraassistant/OrbView.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.SweepGradient
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.abs
          import kotlin.math.min
          import kotlin.math.sin

          /**
           * Liquid-glass वाला चमकता हुआ mic गोला।
           * आवाज़ सुनते समय आपकी आवाज़ के साथ फूलता है, सोचते और बोलते समय रंग बदलता है।
           */
          class OrbView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              enum class State { IDLE, LISTENING, THINKING, SPEAKING }

              var state: State = State.IDLE
                  set(value) {
                      field = value
                      invalidate()
                  }

              private var phase = 0f
              private var level = 0f
              private var targetLevel = 0f

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val white = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val rotMatrix = Matrix()
              private val rect = RectF()

              private val animator = ValueAnimator.ofFloat(0f, TWO_PI).apply {
                  duration = 4000L
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener {
                      phase = it.animatedValue as Float
                      level += (targetLevel - level) * 0.25f
                      if (state != State.LISTENING) targetLevel *= 0.9f
                      invalidate()
                  }
              }

              /** SpeechRecognizer का onRmsChanged यहाँ भेजें */
              fun setLevel(rmsDb: Float) {
                  targetLevel = ((rmsDb + 2f) / 12f).coerceIn(0f, 1f)
              }

              private fun palette(): IntArray = when (state) {
                  State.IDLE -> intArrayOf(0xFF6A5CFF.toInt(), 0xFF00C6FF.toInt(), 0xFFFF4FD8.toInt())
                  State.LISTENING -> intArrayOf(0xFF00E6A8.toInt(), 0xFF00C6FF.toInt(), 0xFF6A5CFF.toInt())
                  State.THINKING -> intArrayOf(0xFFFFB86B.toInt(), 0xFFFF4FD8.toInt(), 0xFF6A5CFF.toInt())
                  State.SPEAKING -> intArrayOf(0xFF00C6FF.toInt(), 0xFF6A5CFF.toInt(), 0xFF00E6A8.toInt())
              }

              private fun withAlpha(c: Int, a: Int) = (c and 0x00FFFFFF) or (a shl 24)

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  animator.start()
              }

              override fun onDetachedFromWindow() {
                  animator.cancel()
                  super.onDetachedFromWindow()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (width == 0 || height == 0) return
                  val cx = width / 2f
                  val cy = height / 2f
                  val base = min(width, height) / 2f * 0.62f
                  val pulse = when (state) {
                      State.IDLE -> 0.03f * sin(phase)
                      State.LISTENING -> level * 0.2f + 0.02f * sin(phase * 4f)
                      State.THINKING -> 0.05f * sin(phase * 6f)
                      State.SPEAKING -> 0.06f * abs(sin(phase * 5f))
                  }
                  val r = base * (1f + pulse)
                  val c = palette()

                  // बाहर की रोशनी (glow)
                  fill.shader = RadialGradient(
                      cx, cy, r * 1.6f,
                      intArrayOf(withAlpha(c[0], 0x88), withAlpha(c[1], 0x33), Color.TRANSPARENT),
                      floatArrayOf(0f, 0.6f, 1f), Shader.TileMode.CLAMP
                  )
                  canvas.drawCircle(cx, cy, r * 1.6f, fill)

                  // सुनते/बोलते समय लहरें
                  if (state == State.LISTENING || state == State.SPEAKING) {
                      stroke.shader = null
                      stroke.strokeWidth = r * 0.025f
                      for (k in 0 until 3) {
                          val p = ((phase / TWO_PI) * 2f + k / 3f) % 1f
                          stroke.color = withAlpha(c[1], ((1f - p) * 160).toInt())
                          canvas.drawCircle(cx, cy, r * (1.05f + p * 0.5f), stroke)
                      }
                  }

                  // घूमता हुआ liquid रंग
                  val sweep = SweepGradient(cx, cy, intArrayOf(c[0], c[1], c[2], c[0]), null)
                  rotMatrix.setRotate(Math.toDegrees(phase.toDouble()).toFloat(), cx, cy)
                  sweep.setLocalMatrix(rotMatrix)
                  fill.shader = sweep
                  canvas.drawCircle(cx, cy, r, fill)

                  // गहराई (नीचे हल्की छाया)
                  fill.shader = RadialGradient(
                      cx, cy - r * 0.2f, r * 1.15f,
                      intArrayOf(Color.TRANSPARENT, 0x66000000),
                      floatArrayOf(0.55f, 1f), Shader.TileMode.CLAMP
                  )
                  canvas.drawCircle(cx, cy, r, fill)

                  // कांच वाली चमक (glass highlight)
                  fill.shader = RadialGradient(
                      cx - r * 0.35f, cy - r * 0.45f, r * 0.85f,
                      intArrayOf(0xCCFFFFFF.toInt(), 0x22FFFFFF, Color.TRANSPARENT),
                      floatArrayOf(0f, 0.45f, 1f), Shader.TileMode.CLAMP
                  )
                  canvas.drawCircle(cx, cy, r, fill)

                  // किनारा
                  stroke.shader = null
                  stroke.color = 0x66FFFFFF
                  stroke.strokeWidth = r * 0.02f
                  canvas.drawCircle(cx, cy, r, stroke)

                  drawMic(canvas, cx, cy, r)
              }

              private fun drawMic(canvas: Canvas, cx: Float, cy: Float, r: Float) {
                  val w = r * 0.13f
                  rect.set(cx - w, cy - r * 0.34f, cx + w, cy + r * 0.06f)
                  canvas.drawRoundRect(rect, w, w, white)
                  stroke.color = Color.WHITE
                  stroke.strokeWidth = r * 0.055f
                  rect.set(cx - r * 0.24f, cy - r * 0.2f, cx + r * 0.24f, cy + r * 0.2f)
                  canvas.drawArc(rect, 0f, 180f, false, stroke)
                  canvas.drawLine(cx, cy + r * 0.2f, cx, cy + r * 0.33f, stroke)
                  canvas.drawLine(cx - r * 0.12f, cy + r * 0.33f, cx + r * 0.12f, cy + r * 0.33f, stroke)
              }

              companion object {
                  private const val TWO_PI = 6.2831855f
              }
          }
          EOF_MERA
