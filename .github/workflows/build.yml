                  setIntent(intent)
                  listenOnResume = true
              }

              override fun onResume() {
                  super.onResume()
                  resumed = true
                  updateAccessibilityStatus()
                  countdownTimer.removeCallbacks(ticker)
                  ticker.run()
                  if (listenOnResume && hasPermission(Manifest.permission.RECORD_AUDIO)) {
                      listenOnResume = false
                      autoListen()
                  }
