              }

              // ---------------- UI helpers ----------------
              private fun greeting(): String {
                  val p = Profile.load(this)
                  if (Profile.daysUntil(p.birthday) == 0) return "🎂 Happy Birthday, ${p.name}! 🎉"
                  val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val part = when (h) {
                      in 5..11 -> "Good Morning ☀️"
                      in 12..16 -> "Good Afternoon 🌤"
                      in 17..20 -> "Good Evening 🌆"
                      else -> "Good Night 🌙"
                  }
                  return "$part, ${p.name} 💖"
              }

              // ---------------- 💖 Profile ----------------
              private fun refreshProfile() {
                  findViewById<TextView>(R.id.greetingText).text = greeting()
                  val p = Profile.load(this)
                  findViewById<TextView>(R.id.subtitleText).text = "${p.partner} ने सिर्फ़ ${p.name} के लिए बनवाया ✨"
                  val lines = mutableListOf("👤  ${p.name}", "💞  ${p.partner} की ${p.relation}")
                  val bd = Profile.daysUntil(p.birthday)
                  if (bd != null) {
                      lines.add("🎂  Birthday: ${Profile.pretty(p.birthday, true)}" + if (bd == 0) " (आज! 🎉)" else " ($bd दिन बाकी)")
                  }
                  val an = Profile.daysUntil(p.anniversary)
                  if (an != null) {
                      lines.add("💍  Anniversary: ${Profile.pretty(p.anniversary, true)}" + if (an == 0) " (आज! 🎉)" else " ($an दिन बाकी)")
                  }
                  if (p.favourites.isNotBlank()) lines.add("⭐  पसंद: ${p.favourites}")
                  findViewById<TextView>(R.id.profileText).text = lines.joinToString("\n")
              }

              // ---------------- 🎂 Birthday countdown ----------------
              private fun updateCountdown() {
                  val p = Profile.load(this)
                  val days = Profile.daysUntil(p.birthday)
                  if (days == null || days > 30) {
                      countdownCard.visibility = View.GONE
                      return
                  }
                  countdownCard.visibility = View.VISIBLE
                  if (days == 0) {
                      countdownTitle.text = "🎉 आज ${p.name} का Birthday है!"
                      countdownTimer.text = "Happy Birthday 🎂💖"
                      return
                  }
                  val target = Profile.nextDate(p.birthday) ?: return
                  val ms = (target.timeInMillis - System.currentTimeMillis()).coerceAtLeast(0L)
                  val d = ms / 86_400_000L
                  val h = (ms / 3_600_000L) % 24
                  val m = (ms / 60_000L) % 60
                  val s = (ms / 1000L) % 60
                  countdownTitle.text = "🎂 Birthday soon, ${p.name}!  •  ${Profile.pretty(p.birthday, true)}"
                  countdownTimer.text = String.format(Locale.US, "%dd  %02dh  %02dm  %02ds", d, h, m, s)
              }

              private fun editProfile() {
                  val p = Profile.load(this)
                  val dp = resources.displayMetrics.density
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((22 * dp).toInt(), (8 * dp).toInt(), (22 * dp).toInt(), 0)
                  }
                  fun field(hintText: String, value: String, type: Int = InputType.TYPE_CLASS_TEXT): EditText {
                      val e = EditText(this)
                      e.hint = hintText
                      e.setText(value)
                      e.inputType = type
                      box.addView(e)
                      return e
                  }
                  val name = field("नाम (जैसे Komal)", p.name)
                  val partner = field("Partner का नाम (जैसे Chiku)", p.partner)
                  val relation = field("रिश्ता (जैसे girlfriend)", p.relation)
                  val birthday = field("Birthday DD-MM (जैसे 14-02)", p.birthday, InputType.TYPE_CLASS_DATETIME)
                  val anniversary = field("Anniversary DD-MM", p.anniversary, InputType.TYPE_CLASS_DATETIME)
                  val favourites = field("पसंद की चीज़ें", p.favourites,
                      InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE)
                  val phone = field("Partner का फ़ोन नंबर", p.partnerPhone, InputType.TYPE_CLASS_PHONE)
                  val message = field("💌 Special message", p.message,
                      InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE)
                  val scroll = ScrollView(this)
                  scroll.addView(box)
                  AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                      .setTitle("💖 Profile")
                      .setView(scroll)
                      .setPositiveButton("Save") { _, _ ->
                          Profile.save(this, Profile.Data(
                              name = name.text.toString().trim().ifBlank { p.name },
                              partner = partner.text.toString().trim(),
                              relation = relation.text.toString().trim(),
                              birthday = birthday.text.toString().trim(),
                              anniversary = anniversary.text.toString().trim(),
                              favourites = favourites.text.toString().trim(),
                              partnerPhone = phone.text.toString().trim(),
                              message = message.text.toString().trim()
                          ))
                          refreshProfile()
                          updateCountdown()
                          Birthday.schedule(this)
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun setupLanguageMenu() {
                  langIndex = prefs.getInt("lang", 0).coerceIn(0, languages.size - 1)
                  val spinner = findViewById<Spinner>(R.id.languageSpinner)
                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_item, languages.map { it.label })
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  spinner.adapter = adapter
                  spinner.setSelection(langIndex)
                  spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          (view as? TextView)?.setTextColor(Color.WHITE)
                          if (position == langIndex) return
                          langIndex = position
                          prefs.edit().putInt("lang", position).apply()
                          applyTtsLanguage()
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
              }

              private fun buildChips() {
                  val row = findViewById<LinearLayout>(R.id.chipsRow)
                  val dp = resources.displayMetrics.density
                  for ((label, cmd) in chips) {
                      val chip = TextView(this).apply {
                          text = label
                          setTextColor(Color.WHITE)
                          textSize = 14f
                          setBackgroundResource(R.drawable.glass_pill)
                          setPadding((16 * dp).toInt(), (11 * dp).toInt(), (16 * dp).toInt(), (11 * dp).toInt())
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                              runText(cmd)
                          }
                      }
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lp.rightMargin = (8 * dp).toInt()
                      row.addView(chip, lp)
                  }
              }

              private fun runText(cmd: String) {
                  if (listening) {
                      recognizer?.cancel()
                      listening = false
                  }
                  heardText.text = "“$cmd”"
                  addHistory(cmd)
                  orb.state = OrbView.State.THINKING
                  commands.handle(listOf(cmd))
              }

              private fun addHistory(text: String) {
                  history.addFirst(text)
                  while (history.size > 6) history.removeLast()
                  historyText.text = history.joinToString("\n") { "•  $it" }
              }

              private fun updateAccessibilityStatus() {
                  accessibilityButton.text = if (AssistantService.instance != null)
                      "✅ System सेवा चालू है (screenshot, lock, home)"
                  else
                      "⚠️ Screenshot / Lock के लिए सेवा चालू करें"
              }

              // ---------------- सुनना ----------------
              private fun startListening() {
                  if (!hasPermission(Manifest.permission.RECORD_AUDIO)) {
                      askPermissions()
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      statusText.text = "आवाज़ पहचानने की सेवा नहीं मिली। Play Store से 'Google' app अपडेट करें।"
                      return
                  }
                  tts?.stop()
                  if (recognizer == null) {
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this).also {
                          it.setRecognitionListener(listener)
                      }
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, currentLang.code)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, currentLang.code)
                      // Google की आवाज़-पहचान सेवा इससे एक साथ कई भाषाएँ समझने की कोशिश करती है
                      if (currentLang.extra.isNotEmpty()) {
                          putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", currentLang.extra)
                      }
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                  }
                  recognizer?.cancel()
                  recognizer?.startListening(intent)
                  listening = true
                  orb.state = OrbView.State.LISTENING
                  heardText.text = ""
                  statusText.text = "🎤 सुन रहा हूँ... बोलिए"
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onRmsChanged(rmsdB: Float) {
                      orb.setLevel(rmsdB)
                      liquid.energy = maxOf(liquid.energy, (rmsdB / 10f).coerceIn(0f, 1f))
                  }

                  override fun onEndOfSpeech() {
                      orb.state = OrbView.State.THINKING
                      statusText.text = "समझ रहा हूँ..."
                  }

                  override fun onError(error: Int) {
                      listening = false
                      orb.state = OrbView.State.IDLE
                      statusText.text = when (error) {
                          SpeechRecognizer.ERROR_NO_MATCH,
                          SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> "कुछ सुनाई नहीं दिया। गोला दबाकर फिर बोलिए।"
                          SpeechRecognizer.ERROR_NETWORK,
                          SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> "इंटरनेट की दिक्कत है।"
                          SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> "माइक की permission दीजिए।"
                          SpeechRecognizer.ERROR_CLIENT -> "गोला दबाकर बोलिए"
                          else -> "कुछ गड़बड़ हुई (code $error)। फिर कोशिश करें।"
                      }
                  }

                  override fun onPartialResults(partialResults: Bundle?) {
                      val p = partialResults
                          ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          ?.firstOrNull()
                      if (!p.isNullOrBlank()) heardText.text = p
                  }

                  override fun onResults(results: Bundle?) {
                      listening = false
                      val matches = results
                          ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          .orEmpty()
                      if (matches.isEmpty()) {
                          orb.state = OrbView.State.IDLE
                          statusText.text = "कुछ समझ नहीं आया।"
                          return
                      }
                      heardText.text = "“${matches[0]}”"
                      addHistory(matches[0])
                      orb.state = OrbView.State.THINKING
                      commands.handle(matches)
                  }
              }

              // ---------------- बोलना ----------------
              fun speak(text: String) {
                  statusText.text = text
                  // emoji ज़ोर से न पढ़े जाएँ, इसलिए बोलने से पहले हटा देते हैं
                  val spoken = text.replace(Regex("[\\p{So}\\p{Sk}\\p{Cs}\\uFE0F\\u200D]"), "").trim()
                  if (ttsReady && spoken.isNotEmpty()) {
                      orb.state = OrbView.State.SPEAKING
                      tts?.speak(spoken, TextToSpeech.QUEUE_FLUSH, null, "chinu-${System.currentTimeMillis()}")
                  } else {
                      orb.state = OrbView.State.IDLE
                  }
              }

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) return
                  ttsReady = true
                  applyTtsLanguage()
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) {
                          runOnUiThread { afterSpeaking() }
                      }
                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) {
                          runOnUiThread { afterSpeaking() }
                      }
                  })
                  welcome()
              }

              /** पहली बार खुलने पर नाम लेकर स्वागत, और birthday वाले दिन wish */
              private fun welcome() {
                  val p = Profile.load(this)
                  val year = Calendar.getInstance().get(Calendar.YEAR)
                  val days = Profile.daysUntil(p.birthday)
                  val bd = Profile.pretty(p.birthday, replyInHindi)
                  val todayKey = year * 1000 + Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  val soon = when (days ?: -1) {
                      1 -> msg(" और हाँ... कल आपका birthday है! 🎂 कल का पूरा दिन सिर्फ़ आपका है ✨",
                               " And guess what... tomorrow is your birthday! 🎂")
                      in 2..7 -> msg(" और हाँ... Birthday soon! 🎂 $bd को आपका birthday है, बस $days दिन बाकी! मैंने countdown शुरू कर दिया है ⏳",
                                     " And... birthday soon! 🎂 Your birthday is on $bd, just $days days to go! Countdown started ⏳")
                      else -> ""
                  }
                  if (days == 0 && prefs.getInt("bdayYear", 0) != year) {
                      // 🎉 Birthday वाले दिन पहली बार खुलने पर: confetti + wish + special message
                      prefs.edit().putInt("bdayYear", year).putBoolean("welcomed", true).putInt("countdownDay", todayKey).apply()
                      confetti.burst(220)
                      confetti.postDelayed({ confetti.burst(160) }, 2500)
                      speak(Birthday.randomWish(p, replyInHindi) + " 💌 " + p.message)
                  } else if (!prefs.getBoolean("welcomed", false)) {
                      // पहली बार install होने पर
                      prefs.edit().putBoolean("welcomed", true).putInt("countdownDay", todayKey).apply()
                      if (soon.isNotEmpty()) confetti.burst(120)
                      speak(msg(
                          "हाय ${p.name}! 💖 मैं Chinu हूँ। मुझे ${p.partner} ने सिर्फ़ आपके लिए बनवाया है।",
                          "Hi ${p.name}! 💖 I'm Chinu. ${p.partner} got me made only for you.") + soon)
                  } else if (soon.isNotEmpty() && prefs.getInt("countdownDay", 0) != todayKey) {
                      // birthday से पहले हर दिन पहली बार खुलने पर countdown याद दिलाना
                      prefs.edit().putInt("countdownDay", todayKey).apply()
                      speak(msg("${p.name}!", "${p.name}!") + soon)
                  } else if (pendingListen) {
                      pendingListen = false
                      startListening()
                  }
              }

              private fun msg(hindi: String, english: String) = if (replyInHindi) hindi else english

              /** बोलने के बाद: Conversation mode में फिर से सुनना शुरू */
              private fun afterSpeaking() {
                  if (orb.state == OrbView.State.SPEAKING) orb.state = OrbView.State.IDLE
                  if (pendingListen && resumed && !listening) {
                      pendingListen = false
                      orb.postDelayed({ if (resumed && !listening) startListening() }, 350)
                      return
                  }
                  if (convoSwitch.isChecked && resumed && !listening) {
                      orb.postDelayed({ if (resumed && !listening) startListening() }, 350)
                  }
              }

              private fun applyTtsLanguage() {
                  if (!ttsReady) return
                  val locale = if (replyInHindi) Locale("hi", "IN") else Locale("en", "IN")
                  val r = tts?.setLanguage(locale)
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts?.language = Locale.ENGLISH
                  }
              }

              // ---------------- Permissions ----------------
              private fun hasPermission(p: String) =
                  checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun askPermissions() {
                  val missing = neededPermissions.filterNot { hasPermission(it) }
                  if (missing.isNotEmpty()) requestPermissions(missing.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (hasPermission(Manifest.permission.RECORD_AUDIO)) {
                      listenOnResume = false
                      autoListen()
                  }
              }

              override fun onDestroy() {
                  recognizer?.destroy()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
