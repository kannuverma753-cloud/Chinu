          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
              <monochrome android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="chinu_bg">#FF070812</color>
              <color name="chinu_accent">#FF00C6FF</color>
              <color name="text_soft">#B3FFFFFF</color>
              <color name="text_dim">#80FFFFFF</color>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Chinu</string>
              <string name="tile_label">Chinu</string>
              <string name="accessibility_desc">Lets Chinu control your phone by voice: screenshots, lock, home, back, scrolling, notifications and auto-sending WhatsApp messages. Chinu never stores or shares what is on your screen.</string>
              <string name="features">🎙️ Say \"Hi Chinu\" anywhere — a Siri-style orb rises on any screen, even when the app is closed\n🧠 Ask anything (\"Narendra Modi kaun hai?\") — answered right on screen, in your language\n📞 Calls by name (emojis in contact names are ignored)\n💬 WhatsApp messages — sent automatically\n📸 Screenshots of any app (\"WhatsApp ka screenshot lo\")\n🔒 Lock · 🏠 Home · ⬅️ Back · 🔔 Notifications · ↕️ Scroll · Split screen\n⏰ Alarms · ⏱ Timers · 🔦 Torch · 🔊 Volume\n🎵 Music: play, pause, next, previous · YouTube\n📶 WiFi · Bluetooth · Hotspot · Location · Airplane · DND\n🔋 Battery · 📅 Date · 🕐 Time · 🧮 Calculator\n🧭 Navigation · 📷 Camera · 🔎 Google search · 😂 Jokes\n🎂 Birthday countdown + midnight wishes\n🌐 English, Hinglish, Hindi and 9 more Indian languages</string>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="ChinuTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/chinu_bg</item>
                  <item name="android:colorAccent">@color/chinu_accent</item>
                  <item name="android:colorPrimary">@color/chinu_bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

              <style name="SectionLabel">
                  <item name="android:layout_width">wrap_content</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:layout_marginTop">24dp</item>
                  <item name="android:layout_marginLeft">4dp</item>
                  <item name="android:fontFamily">monospace</item>
                  <item name="android:letterSpacing">0.2</item>
                  <item name="android:textColor">#FF00C6FF</item>
                  <item name="android:textSize">12sp</item>
              </style>

              <style name="GlassCard">
                  <item name="android:layout_width">match_parent</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:layout_marginTop">10dp</item>
                  <item name="android:background">@drawable/glass_card</item>
                  <item name="android:padding">18dp</item>
              </style>

              <style name="CardTitle">
                  <item name="android:layout_width">wrap_content</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:fontFamily">sans-serif-medium</item>
                  <item name="android:textColor">#FFFFFFFF</item>
                  <item name="android:textSize">16sp</item>
              </style>

              <style name="CardBody">
                  <item name="android:layout_width">wrap_content</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:layout_marginTop">3dp</item>
                  <item name="android:textColor">@color/text_dim</item>
                  <item name="android:textSize">13sp</item>
              </style>

              <style name="SetupRow">
                  <item name="android:layout_width">match_parent</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:layout_marginBottom">8dp</item>
                  <item name="android:background">@drawable/glass_pill</item>
                  <item name="android:paddingLeft">18dp</item>
                  <item name="android:paddingTop">13dp</item>
                  <item name="android:paddingRight">18dp</item>
                  <item name="android:paddingBottom">13dp</item>
                  <item name="android:textColor">#FFFFFFFF</item>
                  <item name="android:textSize">14sp</item>
              </style>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_config.xml')"
          cat > 'app/src/main/res/xml/accessibility_config.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF_MERA
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF_MERA'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_MERA
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_MERA'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_MERA
          mkdir -p "$(dirname 'gradle/wrapper/gradle-wrapper.properties')"
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'EOF_MERA'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF_MERA
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF_MERA'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Chinu"
          include(":app")
          EOF_MERA

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk Chinu.apk

      - name: Save error log (only if build failed)
        if: failure()
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" build.log | head -40 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done || true
          git config user.name "chinu-bot"
          git config user.email "chinu-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git reset -q
          git add -f build.log
          git commit -q -m "build log #${{ github.run_number }}"
          git push -f origin build-log

      - uses: actions/upload-artifact@v4
        with:
          name: Chinu-apk
          path: Chinu.apk

      - name: Publish download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.${{ github.run_number }}
          name: Chinu AI v3.${{ github.run_number }}
          make_latest: true
          files: Chinu.apk
