              private fun findContact(name: String): Contact? {
                  if (!granted(Manifest.permission.READ_CONTACTS)) {
                      reply(msg("Contacts देखने की permission दीजिए", "Please allow Contacts permission"))
                      return null
                  }
                  val match = NameMatcher.best(name, loadContacts()) { it.name }
                  if (match == null) reply(msg("\"$name\" नाम का कोई contact नहीं मिला", "No contact found named \"$name\""))
                  return match
              }

              private fun loadContacts(): List<Contact> {
                  val list = mutableListOf<Contact>()
                  val cursor = activity.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ),
                      null, null, null
                  ) ?: return list
                  cursor.use { c ->
                      while (c.moveToNext()) {
                          val n = c.getString(0)
                          val num = c.getString(1)
                          if (n != null && num != null) list.add(Contact(n, num))
                      }
                  }
                  return list
              }

              private fun dial(number: String, label: String) {
                  val clean = number.filter { it.isDigit() || it == '+' }
                  reply(msg("$label को कॉल कर रहा हूँ", "Calling $label"))
                  val action = if (granted(Manifest.permission.CALL_PHONE)) Intent.ACTION_CALL else Intent.ACTION_DIAL
                  go(Intent(action, Uri.parse("tel:$clean")))
              }

              // ======================= WhatsApp =======================
              private fun whatsapp(text: String) {
                  // "राहुल को व्हाट्सएप पर मैसेज भेजो कि मैं आ रहा हूँ"
                  val delimiters = listOf(" ki ", " कि ", " that ", " saying ", " bolo ", " बोलो ", " likho ", " लिखो ")
                  var namePart = text
                  var message = ""
                  for (d in delimiters) {
                      val i = text.indexOf(d)
                      if (i > 0) {
                          namePart = text.substring(0, i)
                          message = text.substring(i + d.length).trim()
                          break
                      }
                  }
                  val digits = asciiDigits(namePart).filter { it.isDigit() }
                  val number: String
                  val label: String
                  if (digits.length >= 10) {
                      number = digits
                      label = digits
                  } else {
                      val name = stripWords(namePart, WA_FILLER)
                      if (name.isBlank()) {
                          reply(msg("WhatsApp खोल रहा हूँ", "Opening WhatsApp"))
                          activity.packageManager.getLaunchIntentForPackage("com.whatsapp")?.let { go(it) }
                          return
                      }
                      val c = findContact(name) ?: return
                      number = c.number
                      label = c.name
                  }
                  var n = number.filter { it.isDigit() }.trimStart('0')
                  if (n.length == 10) n = "91$n"   // भारत का code
                  val url = "https://wa.me/$n" + if (message.isNotBlank()) "?text=" + Uri.encode(message) else ""
                  reply(msg("$label की WhatsApp chat खोल रहा हूँ", "Opening WhatsApp chat with $label"))
                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).setPackage("com.whatsapp")
                  if (!go(intent)) go(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
              }

              // ======================= Alarm + Timer =======================
              private fun setAlarm(text: String) {
                  val t = asciiDigits(text)
                  val clock = Regex("(\\d{1,2})\\s*[:.]\\s*(\\d{2})").find(t)
                  var hour: Int
                  var minute = 0
                  if (clock != null) {
                      hour = clock.groupValues[1].toInt()
                      minute = clock.groupValues[2].toInt()
                  } else {
                      val nums = Regex("\\d+").findAll(t).map { it.value }.toList()
                      if (nums.isEmpty()) {
                          reply(msg("कितने बजे का alarm लगाऊँ? जैसे: सुबह 6 बजे का alarm लगाओ", "What time? Say: set alarm for 6 AM"))
                          return
                      }
                      hour = nums[0].toInt()
                      if (nums.size >= 2) minute = nums[1].toInt().coerceIn(0, 59)
                  }
                  if (has(t, listOf("साढ़े", "साढे", "sadhe", "saade", "half past"))) minute = 30
                  if (has(t, listOf("सवा", "sawa", "quarter past"))) minute = 15
                  val pm = has(t, listOf("pm", "p.m", "p m", "शाम", "shaam", "sham", "रात", "raat", "दोपहर", "dopahar", "evening", "night", "afternoon"))
                  val am = has(t, listOf("am", "a.m", "सुबह", "subah", "morning"))
                  if (pm && hour < 12) hour += 12
                  if (am && hour == 12) hour = 0
                  if (hour > 23 || minute > 59) {
                      reply(msg("ये समय सही नहीं लगा, फिर से बोलिए", "That time doesn't look right, please try again"))
                      return
                  }
                  val intent = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, hour)
                      .putExtra(AlarmClock.EXTRA_MINUTES, minute)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, "Chinu")
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  val shown = String.format(Locale.US, "%d:%02d %s", if (hour % 12 == 0) 12 else hour % 12, minute, if (hour < 12) "AM" else "PM")
                  if (go(intent)) reply(msg("$shown का alarm लगा दिया ⏰", "Alarm set for $shown ⏰"))
                  else reply(msg("Alarm नहीं लग पाया", "Couldn't set the alarm"))
              }

              private fun setTimer(text: String) {
                  val t = asciiDigits(text)
                  var secs = 0
                  Regex("(\\d+)\\s*(घंटे|घंटा|ghante|ghanta|hours|hour|hrs|hr|मिनट|minutes|minute|mins|min|minat|सेकंड|सेकेंड|seconds|second|secs|sec)")
                      .findAll(t).forEach {
                          val n = it.groupValues[1].toInt()
                          val u = it.groupValues[2]
                          secs += when {
                              u.startsWith("घ") || u.startsWith("gh") || u.startsWith("h") -> n * 3600
                              u.startsWith("से") || u.startsWith("sec") || u.startsWith("se") -> n
                              else -> n * 60
                          }
                      }
                  if (secs == 0) {
                      val n = Regex("\\d+").find(t)?.value?.toInt()
                      if (n == null) {
                          reply(msg("कितने मिनट का timer? जैसे: 5 मिनट का timer लगाओ", "How long? Say: 5 minute timer"))
                          return
                      }
                      secs = n * 60
                  }
                  val intent = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, secs)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, "Chinu")
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  val m = secs / 60
                  val s = secs % 60
                  val shown = if (m > 0 && s > 0) "$m min $s sec" else if (m > 0) "$m min" else "$s sec"
                  if (go(intent)) reply(msg("$shown का timer शुरू ⏱", "Timer started for $shown ⏱"))
                  else reply(msg("Timer नहीं लग पाया", "Couldn't start the timer"))
              }

