                                "Nobody told me the $label date yet. Add it in Profile 💖"))
                      return
                  }
                  val pd = Profile.pretty(ddmm)
                  reply(when (days) {
                      0 -> msg("Aaj hi aapka $label hai! 🎉 Happy $label ${p.name}! 💖", "It's today! 🎉 Happy $label ${p.name}! 💖")
                      1 -> msg("Aapka $label kal hai, $pd ko! 🎂", "Your $label is tomorrow, on $pd! 🎂")
                      else -> msg("Aapka $label $pd ko hai, bas $days din baaki 🎂", "Your $label is on $pd, $days days to go 🎂")
                  })
              }

