              /** lock, home, back, notifications, recents, power menu */
              private fun systemAction(text: String): Boolean {
                  val (action, hi, en, leave) = when {
                      (has(text, LOCK) || Regex("\\block\\b").containsMatchIn(text)) && !text.contains("अनलॉक") ->
                          Quad(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN, "फ़ोन लॉक कर रहा हूँ", "Locking your phone", false)
                      has(text, POWER) ->
                          Quad(AccessibilityService.GLOBAL_ACTION_POWER_DIALOG, "पावर मेनू खोल रहा हूँ", "Opening power menu", false)
                      has(text, QUICK_SETTINGS) ->
                          Quad(AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS, "Quick settings खोल रहा हूँ", "Opening quick settings", false)
                      has(text, NOTIFICATIONS) ->
                          Quad(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS, "Notifications दिखा रहा हूँ", "Showing notifications", false)
                      has(text, RECENTS) ->
                          Quad(AccessibilityService.GLOBAL_ACTION_RECENTS, "हाल के apps दिखा रहा हूँ", "Showing recent apps", false)
                      has(text, HOME) ->
                          Quad(AccessibilityService.GLOBAL_ACTION_HOME, "होम स्क्रीन पर जा रहा हूँ", "Going home", false)
                      has(text, BACK) ->
                          Quad(AccessibilityService.GLOBAL_ACTION_BACK, "पीछे जा रहा हूँ", "Going back", true)
                      else -> return false
                  }
                  val s = service() ?: return true
                  reply(msg(hi, en))
                  if (leave) activity.moveTaskToBack(true)
                  s.global(action, 1200)
                  return true
              }

              private data class Quad(val action: Int, val hi: String, val en: String, val leave: Boolean)

              // ======================= Call =======================
              private data class Contact(val name: String, val number: String)

              private fun makeCall(text: String) {
                  val digits = asciiDigits(text).filter { it.isDigit() }
                  if (digits.length >= 3) {
                      dial(digits, digits)
                      return
                  }
                  val p = profile()
                  val name = stripWords(text, CALL_FILLER)
                  if (name.isBlank() || mentionsPartner(name, p)) {
                      if (mentionsPartner(text, p)) {
                          callPartner(p)
                          return
                      }
                      reply(msg("किसको कॉल करना है? जैसे बोलिए: मम्मी को कॉल करो", "Whom should I call? Say: call Mummy"))
                      return
                  }
                  val c = findContact(name) ?: return
                  dial(c.number, c.name)
              }

              private fun callPartner(p: Profile.Data) {
                  if (p.partnerPhone.isNotBlank()) {
                      dial(p.partnerPhone, "${p.partner} 💖")
                      return
                  }
                  val c = findContact(p.partner) ?: return
                  dial(c.number, "${p.partner} 💖")
              }

              // ======================= 💖 Personal =======================
              private fun mentionsPartner(text: String, p: Profile.Data): Boolean {
                  if (p.partner.isBlank()) return false
                  val tokens = text.replace(Regex("[.,!?।']"), " ").split(Regex("\\s+")).filter { it.isNotBlank() }
                  return tokens.any { NameMatcher.score(it, p.partner) >= 0.85 }
              }

