          cat > 'app/src/main/java/com/meraassistant/ChinuOverlay.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          /**
           * ✨ Siri-style Chinu: a glowing orb rises from the bottom of ANY screen
           * (home screen, inside apps) — no need to open the Chinu app.
           * Listens, answers on screen, and speaks.
           */
          class ChinuOverlay(private val svc: AccessibilityService) : ChinuHost, RecognitionListener, TextToSpeech.OnInitListener {

              override val context: Context get() = svc

              private val wm = svc.getSystemService(WindowManager::class.java)
              private val handler = Handler(Looper.getMainLooper())
              private val processor = CommandProcessor(this)

              private var root: FrameLayout? = null
              private var orb: OrbView? = null
              private var heard: TextView? = null
              private var answer: TextView? = null
              private var card: View? = null

              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var listening = false
              private var listenAfter = false
              private var pendingSpeech: Pair<String, String>? = null
              private val autoClose = Runnable { dismiss(true) }

              // ======================= Show / hide =======================
              fun show(command: String) {
                  if (root == null) build()
                  active = true
                  WakeService.pause()
                  handler.removeCallbacks(autoClose)
                  if (tts == null) tts = TextToSpeech(svc, this)
                  if (command.isNotBlank()) {
                      heard?.text = "“$command”"
                      addHistoryFromOverlay(command)
                      processor.handle(listOf(command))
                  } else {
                      val p = Profile.load(svc)
                      listenAfter = true
                      val en = selectedLang() == "en-IN"
                      reply(if (en) "Yes ${p.name}, I'm listening 💖" else "Haan ${p.name}, bolo, main sun rahi hoon 💖", if (en) "en-IN" else "hi-IN")
                  }
              }

              private fun addHistoryFromOverlay(cmd: String) {
                  heard?.text = "“$cmd”"
              }

              private fun build() {
                  val dp = svc.resources.displayMetrics.density
                  fun px(v: Int) = (v * dp).toInt()

                  val r = FrameLayout(svc)
                  val scrim = View(svc).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(0x0005060F, 0x9905060F.toInt(), 0xF205060F.toInt())
                      )
                      setOnClickListener { dismiss(true) }
                  }
                  r.addView(scrim, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))

                  val col = LinearLayout(svc).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(px(16), 0, px(16), px(36))
                  }

                  val c = LinearLayout(svc).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundResource(R.drawable.neon_card)
                      setPadding(px(22), px(18), px(22), px(18))
                      isClickable = true
                  }
                  val h = TextView(svc).apply {
                      setTextColor(0xB3FFFFFF.toInt())
                      textSize = 14f
                      text = "Listening…"
                  }
                  val a = TextView(svc).apply {
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setLineSpacing(px(4).toFloat(), 1f)
                      setPadding(0, px(6), 0, 0)
                  }
                  val scroll = ScrollView(svc).apply { isVerticalScrollBarEnabled = false }
                  scroll.addView(a)
                  c.addView(h)
                  c.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  col.addView(c, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val o = OrbView(svc).apply {
                      isClickable = true
                      setOnClickListener { if (listening) recognizer?.stopListening() else startListening() }
                  }
                  val olp = LinearLayout.LayoutParams(px(210), px(210))
                  olp.topMargin = px(6)
                  col.addView(o, olp)

                  r.addView(col, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM))

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  try {
                      wm.addView(r, lp)
                  } catch (e: Exception) {
                      return
                  }
                  root = r
                  orb = o
                  heard = h
                  answer = a
                  card = c

                  // ===== Siri-style entry animation =====
                  scrim.alpha = 0f
                  scrim.animate().alpha(1f).setDuration(260).start()
                  o.alpha = 0f
                  o.scaleX = 0.15f
                  o.scaleY = 0.15f
                  o.translationY = px(140).toFloat()
                  o.animate().alpha(1f).scaleX(1f).scaleY(1f).translationY(0f)
                      .setDuration(520).setInterpolator(OvershootInterpolator(1.6f)).start()
                  c.alpha = 0f
                  c.translationY = px(50).toFloat()
                  c.animate().alpha(1f).translationY(0f).setStartDelay(180).setDuration(380).start()
              }

              /** stopVoice=false: the spoken reply keeps playing after the overlay hides */
              fun dismiss(stopVoice: Boolean) {
                  handler.removeCallbacks(autoClose)
                  try {
                      recognizer?.cancel()
                  } catch (e: Exception) {
                  }
                  listening = false
                  listenAfter = false
                  if (stopVoice) {
                      tts?.stop()
                      MainActivity.speaking = false
                  }
                  val r = root ?: run {
                      active = false
                      return
                  }
                  root = null
                  orb = null
                  heard = null
                  answer = null
                  card = null
                  active = false
                  r.animate().alpha(0f).setDuration(180).withEndAction {
                      try {
                          wm.removeView(r)
                      } catch (e: Exception) {
                      }
                  }.start()
                  WakeService.pause()
              }

              private fun removeNow() {
                  val r = root ?: return
                  root = null
                  orb = null
                  heard = null
                  answer = null
                  card = null
                  active = false
                  try {
                      recognizer?.cancel()
                  } catch (e: Exception) {
                  }
                  listening = false
                  try {
                      wm.removeViewImmediate(r)
                  } catch (e: Exception) {
                  }
                  WakeService.pause()
              }

              // ======================= ChinuHost =======================
              override fun selectedLang(): String = LangUtil.selected(svc).code

              override fun reply(text: String, lang: String) {
                  handler.removeCallbacks(autoClose)
                  answer?.text = text
                  orb?.state = OrbView.State.SPEAKING
                  speak(text, lang)
              }

              override fun thinking() {
                  orb?.state = OrbView.State.THINKING
                  answer?.text = "…"
              }

              override fun listenNext() {
                  listenAfter = true
              }

              override fun celebrate() {}

              override fun hideNow() = removeNow()

              override fun leaving() = dismiss(false)

              // ======================= Voice =======================
              private fun speak(text: String, lang: String) {
                  val spoken = LangUtil.speakable(text)
                  if (spoken.isEmpty()) {
                      afterSpeaking()
                      return
                  }
                  if (!ttsReady) {
                      pendingSpeech = text to lang
                      return
                  }
                  LangUtil.applyTts(tts, lang)
                  MainActivity.speaking = true
                  MainActivity.speakingSince = System.currentTimeMillis()
                  tts?.speak(spoken, TextToSpeech.QUEUE_FLUSH, null, "ov-${System.currentTimeMillis()}")
              }

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) return
                  ttsReady = true
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {
                          MainActivity.speaking = true
                          MainActivity.speakingSince = System.currentTimeMillis()
                      }

                      override fun onDone(utteranceId: String?) {
                          handler.post { afterSpeaking() }
                      }

                      override fun onStop(utteranceId: String?, interrupted: Boolean) {
                          MainActivity.speaking = false
                      }

                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) {
                          handler.post { afterSpeaking() }
                      }
                  })
                  pendingSpeech?.let {
                      pendingSpeech = null
                      speak(it.first, it.second)
                  }
              }

              private fun afterSpeaking() {
                  MainActivity.speaking = false
                  if (root == null) return
                  if (listenAfter) {
                      listenAfter = false
                      handler.postDelayed({ if (root != null) startListening() }, 250)
                  } else {
                      orb?.state = OrbView.State.IDLE
                      handler.postDelayed(autoClose, 7000)
                  }
              }

              private fun startListening() {
                  if (root == null) return
                  handler.removeCallbacks(autoClose)
                  tts?.stop()
                  if (recognizer == null) {
                      recognizer = SpeechRecognizer.createSpeechRecognizer(svc).also { it.setRecognitionListener(this) }
                  }
                  val l = LangUtil.selected(svc)
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, l.code)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, l.code)
                      if (l.extra.isNotEmpty()) putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", l.extra)
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                  }
                  try {
                      recognizer?.cancel()
                      recognizer?.startListening(intent)
                      listening = true
                      orb?.state = OrbView.State.LISTENING
                      heard?.text = "Listening…"
                  } catch (e: Exception) {
                      handler.postDelayed(autoClose, 3000)
                  }
              }

              // ======================= RecognitionListener =======================
              override fun onReadyForSpeech(params: Bundle?) {}
              override fun onBeginningOfSpeech() {}
              override fun onBufferReceived(buffer: ByteArray?) {}
              override fun onEvent(eventType: Int, params: Bundle?) {}

              override fun onRmsChanged(rmsdB: Float) {
                  orb?.setLevel(rmsdB)
              }

              override fun onEndOfSpeech() {
                  orb?.state = OrbView.State.THINKING
              }

              override fun onPartialResults(partialResults: Bundle?) {
                  val p = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                  if (!p.isNullOrBlank()) heard?.text = p
              }

              override fun onResults(results: Bundle?) {
                  listening = false
                  val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
                  if (matches.isEmpty()) {
                      onError(SpeechRecognizer.ERROR_NO_MATCH)
                      return
                  }
                  heard?.text = "“${matches[0]}”"
                  orb?.state = OrbView.State.THINKING
                  processor.handle(matches)
              }

              override fun onError(error: Int) {
                  listening = false
                  orb?.state = OrbView.State.IDLE
                  heard?.text = "Didn't catch that — tap the orb to try again"
                  handler.postDelayed(autoClose, 5000)
              }

              companion object {
                  /** WakeService pauses while the overlay is open */
                  @Volatile
                  var active = false
              }
          }
          EOF_MERA
