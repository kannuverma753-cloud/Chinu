              // ======================= मुख्य logic =======================
              fun handle(matches: List<String>) {
                  // सारे अनुमान (alternatives) देखें; जो पहले command पकड़े, वही चलाएँ
                  for (raw in matches) {
                      if (tryRun(raw.lowercase().trim())) return
                  }
                  // कुछ समझ नहीं आया, तो Google पर ढूँढ दें
                  val text = matches.first().trim()
                  reply(msg("ये मैं Google पर ढूँढ रहा हूँ", "Let me search that for you"))
                  webSearch(text)
              }

              private fun tryRun(text: String): Boolean {
                  when {
                      has(text, SCREENSHOT) -> takeScreenshot()
                      systemAction(text) -> {}
                      has(text, WHATSAPP) && has(text, MESSAGE) -> whatsapp(text)
                      has(text, CALL) -> makeCall(text)
                      personal(text) -> {}
                      has(text, ALARM) -> setAlarm(text)
                      has(text, TIMER) -> setTimer(text)
                      has(text, TORCH) -> setTorch(!has(text, OFF))
                      has(text, VOLUME) || has(text, MUTE) -> volume(text)
                      has(text, WIFI) -> panel(Settings.Panel.ACTION_WIFI, "WiFi")
                      has(text, BLUETOOTH) -> panel(Settings.ACTION_BLUETOOTH_SETTINGS, "Bluetooth")
                      has(text, DATA) -> panel(Settings.Panel.ACTION_INTERNET_CONNECTIVITY, "Internet")
                      has(text, BRIGHTNESS) -> panel(Settings.ACTION_DISPLAY_SETTINGS, "Brightness")
                      has(text, BATTERY) -> battery()
                      has(text, DATE) -> tellDate()
                      has(text, TIME) -> tellTime()
                      calculate(text) -> {}
                      has(text, YOUTUBE) && has("$text ", PLAY) && mediaQuery(text).isNotBlank() -> youtube(mediaQuery(text))
                      has(text, MUSIC) && has("$text ", PLAY) -> youtube(mediaQuery(text).ifBlank { "latest hindi songs" } + " song")
                      has(text, NAVIGATE) -> navigate(text)
                      has(text, CAMERA) -> camera(has(text, SELFIE))
                      has(text, JOKE) -> joke()
                      has(text, IDENTITY) -> {
                          val p = profile()
                          reply(msg("मैं Chinu हूँ 💖 मुझे ${p.partner} ने सिर्फ़ ${p.name} के लिए बनवाया है। बोलिए, क्या करूँ?",
                                    "I'm Chinu 💖 ${p.partner} got me made only for ${p.name}. How can I help?"))
                      }
                      has(text, HOW_ARE_YOU) -> reply(msg("मैं एकदम बढ़िया हूँ! आप बताइए, क्या करूँ?", "I'm doing great! What can I do for you?"))
                      has(text, THANKS) -> reply(msg("कोई बात नहीं! हमेशा हाज़िर हूँ 😊", "You're welcome! Always here for you."))
                      has(text, HELP) -> reply(msg(
                          "मैं screenshot, call, WhatsApp, alarm, timer, torch, volume, battery, गाने, रास्ता, calculator, search और बहुत कुछ कर सकता हूँ।",
                          "I can take screenshots, make calls, send WhatsApp, set alarms and timers, control torch and volume, play songs, navigate, calculate, search and more."))
                      isGreeting(text) -> {
                          val n = profile().name
                          reply(msg("हाय $n! 👋 बोलिए, क्या करूँ?", "Hi $n! 👋 What can I do for you?"))
                      }
                      has(text, OPEN) -> openApp(text)
                      has(text, SEARCH) -> {
                          val q = stripWords(text, SEARCH_FILLER)
                          reply(msg("Google पर ढूँढ रहा हूँ", "Searching Google"))
                          webSearch(q.ifBlank { text })
                      }
                      else -> return false
                  }
                  return true
              }

              // ======================= छोटे helpers =======================
              private fun msg(hindi: String, english: String) = if (replyInHindi()) hindi else english

              private fun has(text: String, words: List<String>) = words.any { text.contains(it) }

              private fun stripWords(text: String, filler: Set<String>): String =
                  text.replace(Regex("[.,!?।]"), " ")
                      .split(Regex("\\s+"))
                      .filter { it.isNotBlank() && it !in filler }
                      .joinToString(" ")
                      .trim()

              private fun isGreeting(text: String): Boolean {
                  val tokens = text.replace(Regex("[.,!?।]"), " ").split(Regex("\\s+")).filter { it.isNotBlank() }
                  return tokens.size <= 3 && tokens.any { it in GREET_TOKENS }
              }

              /** किसी भी लिपि के अंकों (९, ৯, ௯ ...) को 0-9 में बदलता है */
              private fun asciiDigits(s: String): String = buildString {
                  for (c in s) if (c.isDigit()) append(Character.getNumericValue(c)) else append(c)
              }

              private fun granted(p: String) =
                  activity.checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun go(intent: Intent): Boolean = try {
                  activity.startActivity(intent)
                  true
              } catch (e: Exception) {
                  false
              }

              // ======================= Screenshot + System =======================
              private fun service(): AssistantService? {
                  val s = AssistantService.instance
                  if (s == null) {
