# Chinu — यह एक ही file पूरा app बनाकर APK दे देती है।
# GitHub पर इसे .github/workflows/build.yml नाम से save करें।
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_MERA'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.meraassistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.meraassistant"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "3.0"
                  // Gemini AI key GitHub Secret (GEMINI_KEY) se aati hai, repo mein kabhi nahi dikhti
                  buildConfigField("String", "GEMINI_KEY", "\"${System.getenv("GEMINI_KEY") ?: ""}\"")
              }

              buildFeatures {
                  buildConfig = true
              }

              // Hamesha ek hi signing key, taaki naya APK purane ke upar seedha update ho jaye
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("chinu.jks")
                      storePassword = "chinu12345"
                      keyAlias = "chinu"
                      keyPassword = "chinu12345"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          // कोई बाहरी library नहीं — सब कुछ Android के अपने tools से बना है।
          EOF_MERA
          mkdir -p "$(dirname 'app/chinu.jks')"
          echo '' | base64 -d > 'app/chinu.jks'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />

              <uses-feature android:name="android.hardware.telephony" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <!-- Android 11+ पर आवाज़ पहचानने, बोलने और apps ढूँढने के लिए ज़रूरी -->
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.google.android.youtube" />
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/ChinuTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- इससे app को "Default digital assistant" के रूप में चुना जा सकता है -->
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
