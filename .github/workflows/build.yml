              // ======================= 🎙️ Hey Chinu =======================
              private fun handleWakeIntent(i: Intent?) {
                  if (i == null || !i.getBooleanExtra(WakeService.EXTRA_WAKE, false)) return
                  // Screen off / locked ho tab bhi Chinu upar aa jaye
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  }
                  val cmd = i.getStringExtra(WakeService.EXTRA_COMMAND).orEmpty().trim()
                  if (cmd.isNotEmpty()) wakeCommand = cmd else wakeGreet = true
                  i.removeExtra(WakeService.EXTRA_WAKE)
                  listenOnResume = false
              }

              private fun handlePendingWake(): Boolean {
                  if (!ttsReady) return wakeCommand != null || wakeGreet
                  val cmd = wakeCommand
                  if (cmd != null) {
                      wakeCommand = null
                      runText(cmd)
                      return true
                  }
                  if (wakeGreet) {
                      wakeGreet = false
                      val p = Profile.load(this)
                      pendingListen = true
                      speak(msg("Haan ${p.name}, bolo, main sun rahi hoon 💖", "Yes ${p.name}, I'm listening 💖"))
                      return true
                  }
                  return false
              }

              private fun setupWakeSwitch() {
                  wakeSwitch.setOnCheckedChangeListener(null)
                  wakeSwitch.isChecked = prefs.getBoolean("wake", true)
                  wakeSwitch.setOnCheckedChangeListener { _, on ->
                      prefs.edit().putBoolean("wake", on).apply()
                      if (on) {
                          WakeService.start(this)
                          askBatteryExemption(force = true)
                          speak(msg("Done! Ab bas bolo \"Hey Chinu\" 💖", "Done! Now just say \"Hey Chinu\" 💖"))
                      } else {
                          WakeService.stop(this)
                      }
                  }
              }

              private fun askBatteryExemption(force: Boolean = false) {
                  if (!force && prefs.getBoolean("askedBattery", false)) return
                  prefs.edit().putBoolean("askedBattery", true).apply()
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  if (pm.isIgnoringBatteryOptimizations(packageName)) return
                  try {
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                  } catch (e: Exception) {
                  }
              }

              // ======================= 💖 Profile =======================
              private fun refreshProfile() {
