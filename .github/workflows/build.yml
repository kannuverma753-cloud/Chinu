          package com.meraassistant

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RenderEffect
          import android.graphics.Shader
          import android.os.Build
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          /**
           * पीछे बहते हुए रंगीन liquid धब्बे — इन्हीं के ऊपर glass cards चमकते हैं।
           * Android 12+ पर असली blur लगता है।
           */
          class LiquidBackground @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val colors = intArrayOf(
                  0xFF6A5CFF.toInt(), 0xFF00C6FF.toInt(), 0xFFFF4FD8.toInt(), 0xFF00E6A8.toInt()
              )
              private var t = 0f

              /** आवाज़ तेज़ होने पर धब्बे थोड़े फूलते हैं (0..1) */
              var energy = 0f

              private val animator = ValueAnimator.ofFloat(0f, (2 * Math.PI).toFloat()).apply {
                  duration = 20000L
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener {
                      t = it.animatedValue as Float
                      invalidate()
                  }
              }

              init {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      setRenderEffect(RenderEffect.createBlurEffect(70f, 70f, Shader.TileMode.CLAMP))
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  animator.start()
              }

              override fun onDetachedFromWindow() {
                  animator.cancel()
                  super.onDetachedFromWindow()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawColor(0xFF070812.toInt())
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  for (i in colors.indices) {
                      val cx = w * (0.5f + 0.38f * sin(t * (1f + i * 0.35f) + i * 1.7f))
                      val cy = h * (0.42f + 0.3f * cos(t * (0.7f + i * 0.3f) + i * 2.1f))
                      val r = min(w, h) * (0.55f + 0.08f * sin(t * 2f + i)) * (1f + energy * 0.25f)
                      paint.shader = RadialGradient(
                          cx, cy, r,
                          intArrayOf((colors[i] and 0x00FFFFFF) or (0x80 shl 24), Color.TRANSPARENT),
                          null, Shader.TileMode.CLAMP
                      )
                      canvas.drawCircle(cx, cy, r, paint)
                  }
                  energy *= 0.95f
              }
          }
