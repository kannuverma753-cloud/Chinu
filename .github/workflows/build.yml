              private fun buildActions() {
                  val grid = findViewById<LinearLayout>(R.id.actionsGrid)
                  val dp = resources.displayMetrics.density
                  val perRow = 4
                  var row: LinearLayout? = null
                  actions.forEachIndexed { i, (emoji, label, cmd) ->
                      if (i % perRow == 0) {
                          row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                          val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                          if (i > 0) lp.topMargin = (8 * dp).toInt()
                          grid.addView(row, lp)
                      }
                      val tile = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setBackgroundResource(R.drawable.glass_tile)
                          setPadding(0, (12 * dp).toInt(), 0, (12 * dp).toInt())
                          isClickable = true
                          isFocusable = true
                          setOnClickListener {
                              it.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                              runText(cmd)
                          }
                      }
                      tile.addView(TextView(this).apply {
                          text = emoji
                          textSize = 22f
                          gravity = Gravity.CENTER
                      })
                      tile.addView(TextView(this).apply {
                          text = label
                          textSize = 11f
                          setTextColor(0xCCFFFFFF.toInt())
                          gravity = Gravity.CENTER
                          maxLines = 1
                          setPadding((2 * dp).toInt(), (4 * dp).toInt(), (2 * dp).toInt(), 0)
                      })
                      val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      if (i % perRow != 0) lp.leftMargin = (8 * dp).toInt()
                      row?.addView(tile, lp)
                  }
              }

              private fun runText(cmd: String) {
                  if (listening) {
                      recognizer?.cancel()
                      listening = false
                  }
                  heardText.text = "“$cmd”"
                  addHistory(cmd)
                  setState(OrbView.State.THINKING)
                  commands.handle(listOf(cmd))
              }

              private fun addHistory(text: String) {
                  val t = Calendar.getInstance()
                  val stamp = String.format(Locale.US, "%02d:%02d", t.get(Calendar.HOUR_OF_DAY), t.get(Calendar.MINUTE))
                  history.addFirst("$stamp  ›  $text")
                  while (history.size > 6) history.removeLast()
                  historyText.text = history.joinToString("\n")
              }

