          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/java/com/meraassistant/AssistantService.kt')"
          cat > 'app/src/main/java/com/meraassistant/AssistantService.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          /**
           * Chinu's "hands": system actions that a normal app can't do.
           * Screenshot, lock, home, back, recents, notifications, power menu, split screen,
           * scrolling, and pressing WhatsApp's Send button automatically.
           */
          class AssistantService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var sendUntil = 0L
              private var onSent: (() -> Unit)? = null
              private var overlay: ChinuOverlay? = null

              /** ✨ Siri-style Chinu on top of any screen */
              fun showOverlay(command: String) {
                  val o = overlay ?: ChinuOverlay(this).also { overlay = it }
                  o.show(command)
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  overlay?.dismiss(true)
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              override fun onInterrupt() {}

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (System.currentTimeMillis() > sendUntil) return
                  val pkg = event?.packageName?.toString() ?: return
                  if (pkg == "com.whatsapp" || pkg == "com.whatsapp.w4b") trySend()
              }

              // ---------------- WhatsApp auto-send ----------------
              /** Next 15 seconds: jaise hi WhatsApp chat khule, Send button daba do */
              fun armWhatsAppSend(sent: (() -> Unit)? = null) {
                  sendUntil = System.currentTimeMillis() + 15_000
                  onSent = sent
                  // events na aaye to bhi kuch baar khud try karo
                  for (d in listOf(1500L, 2500L, 3500L, 5000L)) handler.postDelayed({ trySend() }, d)
              }

              private fun trySend() {
                  if (System.currentTimeMillis() > sendUntil) return
                  val root = rootInActiveWindow ?: return
                  val pkg = root.packageName?.toString() ?: return
                  if (pkg != "com.whatsapp" && pkg != "com.whatsapp.w4b") return
                  val byId = root.findAccessibilityNodeInfosByViewId("$pkg:id/send")
                  val target = byId.firstOrNull { it.isVisibleToUser && it.isEnabled } ?: findByDescription(root)
                  if (target != null && clickNode(target)) {
                      sendUntil = 0
                      onSent?.invoke()
                      onSent = null
                  }
              }

              private fun findByDescription(node: AccessibilityNodeInfo?, depth: Int = 0): AccessibilityNodeInfo? {
                  if (node == null || depth > 30) return null
                  val d = node.contentDescription?.toString()?.lowercase() ?: ""
                  if ((d == "send" || d == "भेजें") && node.isVisibleToUser) return node
                  for (i in 0 until node.childCount) {
                      val r = findByDescription(node.getChild(i), depth + 1)
                      if (r != null) return r
                  }
                  return null
              }

              private fun clickNode(n: AccessibilityNodeInfo): Boolean {
                  var cur: AccessibilityNodeInfo? = n
                  var hops = 0
                  while (cur != null && hops < 4) {
                      if (cur.isClickable) return cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      cur = cur.parent
                      hops++
                  }
                  return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              // ---------------- System actions ----------------
              fun takeScreenshot(delayMs: Long) = global(GLOBAL_ACTION_TAKE_SCREENSHOT, delayMs)

              fun global(action: Int, delayMs: Long) {
                  handler.postDelayed({ performGlobalAction(action) }, delayMs)
              }

              /** Screen ko upar/neeche scroll karta hai */
              fun scroll(down: Boolean, delayMs: Long) {
                  handler.postDelayed({
                      val dm = resources.displayMetrics
                      val x = dm.widthPixels / 2f
                      val h = dm.heightPixels.toFloat()
                      val path = Path()
                      if (down) {
                          path.moveTo(x, h * 0.72f)
                          path.lineTo(x, h * 0.28f)
                      } else {
                          path.moveTo(x, h * 0.28f)
                          path.lineTo(x, h * 0.72f)
                      }
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, 320))
                          .build()
                      dispatchGesture(gesture, null, null)
                  }, delayMs)
              }

              companion object {
                  @Volatile
                  var instance: AssistantService? = null
                      private set
              }
          }
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/java/com/meraassistant/Birthday.kt')"
          cat > 'app/src/main/java/com/meraassistant/Birthday.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.Manifest
          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import java.util.Calendar

          /**
           * 🎂 Birthday surprise mode:
           * birthday से 2 दिन पहले, 1 दिन पहले, ठीक रात 12 बजे और सुबह 9 बजे notification।
           */
          object Birthday {

              private const val CHANNEL = "birthday"

              private val wishesHinglish = listOf(
                  "Happy Birthday %1\$s! 🎂 Bhagwan kare aapki har wish poori ho, aur aapki smile hamesha aise hi chamakti rahe 💖",
                  "Janamdin mubarak ho %1\$s! 🎉 Aap %2\$s ki duniya ki sabse special insaan ho ✨",
                  "Happy Birthday %1\$s! 🥳 Aaj cake bhi aapka, din bhi aapka, aur %2\$s ka dil bhi aapka 💖",
                  "Many many happy returns of the day, %1\$s! 🎂 Ye saal aapke liye dher saari khushiyan aur pyaar laaye 🌸",
                  "Happy Birthday meri pyaari %1\$s! 🎈 %2\$s ne mujhse kaha hai ki aaj aapko duniya ki sabse khush ladki banana hai 😊💖"
              )
              private val wishesEn = listOf(
                  "Happy Birthday %1\$s! 🎂 May all your wishes come true and your smile keep shining forever 💖",
                  "Happy Birthday %1\$s! 🎉 You are the most special person in %2\$s's world ✨",
                  "Happy Birthday %1\$s! 🥳 Today the cake is yours, the day is yours, and %2\$s's heart is yours too 💖",
                  "Many happy returns of the day, %1\$s! 🎂 May this year bring you endless happiness 🌸"
              )

              fun randomWish(p: Profile.Data, hinglish: Boolean): String =
                  String.format((if (hinglish) wishesHinglish else wishesEn).random(), p.name, p.partner)

              fun createChannel(ctx: Context) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  val ch = NotificationChannel(CHANNEL, "Birthday 🎂", NotificationManager.IMPORTANCE_HIGH)
                  ch.description = "Birthday reminders and wishes"
                  nm.createNotificationChannel(ch)
              }

              /** सारे birthday notifications सेट करता है (जो समय निकल चुका, उन्हें छोड़कर) */
              fun schedule(ctx: Context) {
                  createChannel(ctx)
                  val p = Profile.load(ctx)
                  val bday = Profile.nextDate(p.birthday) ?: return
                  val am = ctx.getSystemService(AlarmManager::class.java)
                  // (id, कितने दिन पहले, कितने बजे)
                  val plan = listOf(Triple(1, -2, 9), Triple(2, -1, 9), Triple(3, 0, 0), Triple(4, 0, 9))
                  for ((id, offset, hour) in plan) {
                      val t = (bday.clone() as Calendar).apply {
                          add(Calendar.DAY_OF_YEAR, offset)
                          set(Calendar.HOUR_OF_DAY, hour)
                      }
                      val pi = PendingIntent.getBroadcast(
                          ctx, id,
                          Intent(ctx, BirthdayReceiver::class.java).putExtra("kind", id),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      if (t.timeInMillis <= System.currentTimeMillis()) {
                          am.cancel(pi)
                          continue
                      }
                      try {
                          val exactOk = Build.VERSION.SDK_INT < Build.VERSION_CODES.S || am.canScheduleExactAlarms()
                          if (exactOk) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.timeInMillis, pi)
                          else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.timeInMillis, pi)
                      } catch (e: SecurityException) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.timeInMillis, pi)
                      }
                  }
              }

              /** Phone restart के बाद "Hello Chinu" फिर चालू करने की याद */
              fun remindWake(ctx: Context) {
                  val on = ctx.getSharedPreferences("settings", Context.MODE_PRIVATE).getBoolean("wake", true)
                  if (!on) return
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ctx.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) return
                  createChannel(ctx)
                  val open = PendingIntent.getActivity(
                      ctx, 20, Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(ctx, CHANNEL)
                      .setSmallIcon(R.drawable.ic_mic)
                      .setContentTitle("🎙️ Wake up Chinu")
                      .setContentText("Your phone restarted. Tap once so \"Hey Chinu\" works again 💖")
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  ctx.getSystemService(NotificationManager::class.java).notify(99, n)
              }

              fun notify(ctx: Context, kind: Int) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ctx.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) return
                  createChannel(ctx)
                  val p = Profile.load(ctx)
                  val n = p.name
                  val (title, text) = when (kind) {
                      1 -> "🎂 Birthday soon, $n!" to "Just 2 days to go! ${p.partner} and Chinu are super excited 💖"
                      2 -> "🎂 Tomorrow is your birthday, $n!" to "One more night... tomorrow is all yours ✨"
                      3 -> "🎉 Happy Birthday $n! 🎂" to "It's midnight! Lots of love from ${p.partner} 💖 Open Chinu, a surprise is waiting!"
                      else -> "🎂 Happy Birthday $n! 💖" to randomWish(p, false)
                  }
                  val open = PendingIntent.getActivity(
                      ctx, 10 + kind,
                      Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val notification = Notification.Builder(ctx, CHANNEL)
                      .setSmallIcon(R.drawable.ic_mic)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  ctx.getSystemService(NotificationManager::class.java).notify(100 + kind, notification)
              }
          }

          /** Alarm आने पर notification दिखाता है; phone restart होने पर फिर से schedule करता है */
          class BirthdayReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      Intent.ACTION_BOOT_COMPLETED, Intent.ACTION_MY_PACKAGE_REPLACED -> {
                          Birthday.schedule(context)
                          Birthday.remindWake(context)
                      }
                      else -> Birthday.notify(context, intent.getIntExtra("kind", 4))
                  }
              }
          }
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/java/com/meraassistant/Brain.kt')"
          cat > 'app/src/main/java/com/meraassistant/Brain.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Interface implemented by every Chinu screen (full app + Siri-style overlay). */
          interface ChinuHost {
              val context: Context
              fun selectedLang(): String
              fun reply(text: String, lang: String)
              fun thinking()
              fun listenNext()
              fun celebrate()
              fun hideNow()
              fun leaving()
          }

          /** Languages + script detection + text-to-speech voice selection. */
          object LangUtil {
              class Lang(val label: String, val code: String, val extra: Array<String> = emptyArray())

              val languages = listOf(
                  Lang("Auto · Hinglish (Hindi + English)", "hi-IN", arrayOf("en-IN", "en-US")),
                  Lang("English", "en-IN", arrayOf("en-US", "hi-IN")),
                  Lang("Hindi", "hi-IN"),
                  Lang("Marathi", "mr-IN", arrayOf("en-IN")),
                  Lang("Bengali", "bn-IN", arrayOf("en-IN")),
                  Lang("Tamil", "ta-IN", arrayOf("en-IN")),
                  Lang("Telugu", "te-IN", arrayOf("en-IN")),
                  Lang("Gujarati", "gu-IN", arrayOf("en-IN")),
                  Lang("Kannada", "kn-IN", arrayOf("en-IN")),
                  Lang("Malayalam", "ml-IN", arrayOf("en-IN")),
                  Lang("Punjabi", "pa-IN", arrayOf("en-IN")),
                  Lang("Urdu", "ur-IN", arrayOf("en-IN"))
              )

              fun selected(ctx: Context): Lang {
                  val i = ctx.getSharedPreferences("settings", Context.MODE_PRIVATE).getInt("lang", 0)
                  return languages[i.coerceIn(0, languages.size - 1)]
              }

              /** Detects the language from the script the user spoke in. */
              fun detect(text: String, selected: String): String {
                  for (c in text) {
                      when (Character.UnicodeBlock.of(c)) {
                          Character.UnicodeBlock.DEVANAGARI -> return if (selected == "mr-IN") "mr-IN" else "hi-IN"
                          Character.UnicodeBlock.BENGALI -> return "bn-IN"
                          Character.UnicodeBlock.TAMIL -> return "ta-IN"
                          Character.UnicodeBlock.TELUGU -> return "te-IN"
                          Character.UnicodeBlock.GUJARATI -> return "gu-IN"
                          Character.UnicodeBlock.KANNADA -> return "kn-IN"
                          Character.UnicodeBlock.MALAYALAM -> return "ml-IN"
                          Character.UnicodeBlock.GURMUKHI -> return "pa-IN"
                          Character.UnicodeBlock.ARABIC -> return "ur-IN"
                          else -> {}
                      }
                  }
                  return if (selected == "hi-IN") "hi-IN" else "en-IN"
              }

              /** Sets the TTS voice for this language, with safe fallbacks. */
              fun applyTts(tts: TextToSpeech?, lang: String) {
                  if (tts == null) return
                  for (tag in listOf(lang, "hi-IN", "en-IN")) {
                      val r = tts.setLanguage(Locale.forLanguageTag(tag))
                      if (r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED) return
                  }
                  tts.language = Locale.ENGLISH
              }

              /** Emojis are not read aloud. */
              fun speakable(text: String) =
                  text.replace(Regex("[\\p{So}\\p{Sk}\\p{Cs}\\uFE0F\\u200D*#_`]"), "").trim()
          }

          /**
           * Chinu's AI brain: answers any question directly on screen.
           * - With a free Gemini key: full AI (any question, any language).
           * - Without a key: answers "who/what is ..." from Wikipedia.
           */
          object Brain {
              private val main = Handler(Looper.getMainLooper())
              private val history = ArrayDeque<Pair<String, String>>()
              private val models = listOf("gemini-flash-latest", "gemini-3.5-flash", "gemini-2.5-flash", "gemini-flash-lite-latest")

              @Volatile
              private var goodModel: String? = null

              /** App mein daali key, warna build ke waqt GitHub Secret se aayi key */
              fun key(ctx: Context): String {
                  val own = ctx.getSharedPreferences("settings", Context.MODE_PRIVATE).getString("geminiKey", "").orEmpty().trim()
                  return own.ifEmpty { BuildConfig.GEMINI_KEY.trim() }
              }

              fun setKey(ctx: Context, k: String) {
                  ctx.getSharedPreferences("settings", Context.MODE_PRIVATE).edit().putString("geminiKey", k.trim()).apply()
                  goodModel = null
              }

              fun ask(ctx: Context, question: String, lang: String, done: (String) -> Unit) {
                  val app = ctx.applicationContext
                  val p = Profile.load(app)
                  Thread {
                      val ans = try {
                          val k = key(app)
                          (if (k.isNotEmpty()) gemini(k, question, p) else null)
                              ?: wikipedia(question, lang)
                              ?: fallback(lang, k.isNotEmpty())
                      } catch (e: Exception) {
                          fallback(lang, key(app).isNotEmpty())
                      }
                      main.post { done(ans) }
                  }.start()
              }

              private fun fallback(lang: String, hasKey: Boolean): String {
                  val en = lang == "en-IN"
                  return when {
                      hasKey && en -> "I couldn't get an answer right now. Please check your internet and try again."
                      hasKey -> "Abhi jawab nahi mil paaya. Internet check karke phir se poochho."
                      en -> "I couldn't find that. Add a free Gemini AI key in Chinu's settings and I'll answer anything!"
                      else -> "Iska jawab mujhe nahi mila. App mein free Gemini AI key daal do, phir main har sawaal ka jawab de paungi!"
                  }
              }

              // ---------------- Gemini ----------------
              private fun turn(role: String, text: String) =
                  JSONObject().put("role", role).put("parts", JSONArray().put(JSONObject().put("text", text)))

              private fun gemini(key: String, q: String, p: Profile.Data): String? {
                  val today = SimpleDateFormat("EEEE, d MMMM yyyy", Locale.ENGLISH).format(Date())
                  val sys = "You are Chinu, a warm, friendly and very smart female AI voice assistant living inside ${p.name}'s Android phone. " +
                      "${p.partner} made you only for ${p.name} (${p.partner}'s ${p.relation}). " +
                      "Answer like a real AI assistant: give the actual answer directly. Never say you will search Google or tell the user to search. " +
                      "Reply in the same language and script the user used. If they mix Hindi and English, reply in natural Hinglish written in Latin script. " +
                      "Keep it short and natural to speak aloud: 2 to 4 sentences. No markdown, no lists. Today is $today."
                  val contents = JSONArray()
                  for ((u, a) in history) {
                      contents.put(turn("user", u))
                      contents.put(turn("model", a))
                  }
                  contents.put(turn("user", q))
                  val body = JSONObject()
                      .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sys))))
                      .put("contents", contents)
                      .put("generationConfig", JSONObject().put("maxOutputTokens", 1200).put("temperature", 0.7))
                      .toString()
                  val order = listOfNotNull(goodModel) + models.filter { it != goodModel }
                  for (m in order) {
                      val (code, resp) = request(
                          "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent",
                          body, mapOf("x-goog-api-key" to key)
                      )
                      if (code == 200) {
                          val parts = JSONObject(resp).optJSONArray("candidates")?.optJSONObject(0)
                              ?.optJSONObject("content")?.optJSONArray("parts") ?: return null
                          val sb = StringBuilder()
                          for (i in 0 until parts.length()) {
                              val part = parts.optJSONObject(i) ?: continue
                              if (part.optBoolean("thought", false)) continue
                              sb.append(part.optString("text"))
                          }
                          val text = sb.toString().replace(Regex("[*#`]+"), "").trim()
                          if (text.isBlank()) return null
                          goodModel = m
                          history.addLast(q to text)
                          while (history.size > 6) history.removeFirst()
                          return text
                      }
                      if (code == 400 && resp.contains("API_KEY", ignoreCase = true) || code == 401 || code == 403) {
                          return "Gemini AI key sahi nahi hai. Chinu app mein AI key check karo. / The Gemini key looks invalid."
                      }
                      if (code == 429) return null
                      // 404 = model not available, try the next one
                  }
                  return null
              }

              // ---------------- Wikipedia (no key needed) ----------------
              private val questionWords = listOf(
                  "ke baare mein batao", "ke bare mein batao", "ke baare me batao", "ke bare me batao", "ke baare mein", "ke bare mein",
                  "के बारे में बताओ", "के बारे में", "kaun hai", "kaun he", "kon hai", "kaun the", "kaun tha", "kya hai", "kya hota hai",
                  "kya hote hain", "who is", "who was", "what is", "what are", "tell me about", "explain", "batao", "bataiye", "btao",
                  "कौन है", "कौन थे", "कौन था", "क्या है", "क्या होता है", "बताओ", "बताइए", "chinu", "चीनू", "hey", "hi ", "please", "?"
              )

              private fun topicOf(q: String): String {
                  var t = " ${q.lowercase()} "
                  for (w in questionWords) t = t.replace(w, " ")
                  return t.replace(Regex("\\s+"), " ").trim()
              }

              private fun wikiLang(text: String, lang: String): String {
                  for (c in text) {
                      when (Character.UnicodeBlock.of(c)) {
                          Character.UnicodeBlock.DEVANAGARI -> return if (lang == "mr-IN") "mr" else "hi"
                          Character.UnicodeBlock.BENGALI -> return "bn"
                          Character.UnicodeBlock.TAMIL -> return "ta"
                          Character.UnicodeBlock.TELUGU -> return "te"
                          Character.UnicodeBlock.GUJARATI -> return "gu"
                          Character.UnicodeBlock.KANNADA -> return "kn"
                          Character.UnicodeBlock.MALAYALAM -> return "ml"
                          Character.UnicodeBlock.GURMUKHI -> return "pa"
                          Character.UnicodeBlock.ARABIC -> return "ur"
                          else -> {}
                      }
                  }
                  return "en"
              }

              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8").replace("+", "%20")

              private fun wikipedia(q: String, lang: String): String? {
                  val topic = topicOf(q)
                  if (topic.length < 2) return null
                  val wl = wikiLang(topic, lang)
                  val (c1, s) = request("https://$wl.wikipedia.org/w/api.php?action=query&list=search&format=json&srlimit=1&srsearch=" + enc(topic))
                  if (c1 != 200) return null
                  val title = JSONObject(s).optJSONObject("query")?.optJSONArray("search")
                      ?.optJSONObject(0)?.optString("title").orEmpty()
                  if (title.isBlank()) return null
                  val (c2, sum) = request("https://$wl.wikipedia.org/api/rest_v1/page/summary/" + enc(title.replace(' ', '_')))
                  if (c2 != 200) return null
                  val extract = JSONObject(sum).optString("extract").trim()
                  if (extract.isBlank()) return null
                  val sentences = extract.split(Regex("(?<=[.!?।])\\s+"))
                  return sentences.take(3).joinToString(" ")
              }

              // ---------------- HTTP ----------------
              private fun request(url: String, body: String? = null, headers: Map<String, String> = emptyMap()): Pair<Int, String> {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 12000
                  c.readTimeout = 20000
                  c.setRequestProperty("User-Agent", "ChinuAI/2.0 (Android voice assistant)")
                  for ((k, v) in headers) c.setRequestProperty(k, v)
                  if (body != null) {
                      c.requestMethod = "POST"
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      c.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                  }
                  val code = c.responseCode
                  val stream = if (code in 200..299) c.inputStream else c.errorStream
                  val text = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() }.orEmpty()
                  c.disconnect()
                  return code to text
              }
          }
          EOF_MERA
