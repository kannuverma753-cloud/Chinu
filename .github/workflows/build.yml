              // ======================= 🎂 Countdown =======================
              private fun updateCountdown() {
                  val p = Profile.load(this)
                  val days = Profile.daysUntil(p.birthday)
                  if (days == null || days > 30) {
                      countdownCard.visibility = View.GONE
                      return
                  }
                  countdownCard.visibility = View.VISIBLE
                  if (days == 0) {
                      countdownTitle.text = "TODAY IS ${p.name.uppercase()}'S BIRTHDAY"
                      countdownTimer.text = "🎂 Happy Birthday 💖"
                      return
                  }
                  val target = Profile.nextDate(p.birthday) ?: return
                  val ms = (target.timeInMillis - System.currentTimeMillis()).coerceAtLeast(0L)
                  val d = ms / 86_400_000L
                  val h = (ms / 3_600_000L) % 24
                  val m = (ms / 60_000L) % 60
                  val s = (ms / 1000L) % 60
                  countdownTitle.text = "BIRTHDAY COUNTDOWN · ${Profile.pretty(p.birthday).uppercase()}"
                  countdownTimer.text = String.format(Locale.US, "%02dd  %02dh  %02dm  %02ds", d, h, m, s)
              }

              // ======================= Listening =======================
              private fun autoListen() {
                  if (tts?.isSpeaking == true || !ttsReady) pendingListen = true else startListening()
              }

              private fun startListening() {
                  if (!hasPermission(Manifest.permission.RECORD_AUDIO)) {
                      askPermissions()
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      statusText.text = "Speech recognition not found. Please update the Google app."
                      return
                  }
                  tts?.stop()
                  if (recognizer == null) {
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this).also { it.setRecognitionListener(listener) }
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, currentLang.code)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, currentLang.code)
                      if (currentLang.extra.isNotEmpty()) {
                          putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", currentLang.extra)
                      }
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                  }
                  recognizer?.cancel()
                  recognizer?.startListening(intent)
                  listening = true
                  setState(OrbView.State.LISTENING)
                  heardText.text = ""
                  statusText.text = "Listening…"
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onRmsChanged(rmsdB: Float) {
                      orb.setLevel(rmsdB)
                      liquid.energy = maxOf(liquid.energy, (rmsdB / 10f).coerceIn(0f, 1f))
                  }

                  override fun onEndOfSpeech() {
                      setState(OrbView.State.THINKING)
                      statusText.text = "Thinking…"
                  }

                  override fun onError(error: Int) {
                      listening = false
                      setState(OrbView.State.IDLE)
                      statusText.text = when (error) {
                          SpeechRecognizer.ERROR_NO_MATCH,
                          SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> "Didn't hear anything. Tap the orb and try again."
                          SpeechRecognizer.ERROR_NETWORK,
                          SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> "Network problem. Check your internet."
                          SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> "Please allow microphone permission."
                          SpeechRecognizer.ERROR_CLIENT -> "Tap the orb or say “Hey Chinu”"
                          else -> "Something went wrong (code $error). Try again."
                      }
                  }

                  override fun onPartialResults(partialResults: Bundle?) {
                      val p = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                      if (!p.isNullOrBlank()) heardText.text = p
                  }

                  override fun onResults(results: Bundle?) {
                      listening = false
                      val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
                      if (matches.isEmpty()) {
                          setState(OrbView.State.IDLE)
                          statusText.text = "Didn't catch that."
                          return
                      }
                      heardText.text = "“${matches[0]}”"
                      addHistory(matches[0])
                      setState(OrbView.State.THINKING)
                      commands.handle(matches)
                  }
              }

              // ======================= ChinuHost =======================
              override val context: android.content.Context get() = this
              override fun selectedLang(): String = currentLang.code
              override fun reply(text: String, lang: String) = speak(text, lang)
              override fun thinking() {
                  setState(OrbView.State.THINKING)
                  statusText.text = "Thinking…"
              }
              override fun listenNext() {
                  pendingListen = true
              }
              override fun celebrate() = confetti.burst()
              override fun hideNow() {
                  moveTaskToBack(true)
              }
              override fun leaving() {}

              // ======================= Speaking =======================
              fun speak(text: String) = speak(text, if (hinglish) "hi-IN" else "en-IN")

              fun speak(text: String, lang: String) {
                  statusText.text = text
                  // Emoji zor se na padhe jayein
                  val spoken = LangUtil.speakable(text)
                  if (ttsReady && spoken.isNotEmpty()) {
                      LangUtil.applyTts(tts, lang)
                      speaking = true
                      speakingSince = System.currentTimeMillis()
                      setState(OrbView.State.SPEAKING)
                      tts?.speak(spoken, TextToSpeech.QUEUE_FLUSH, null, "chinu-${System.currentTimeMillis()}")
                  } else {
                      setState(OrbView.State.IDLE)
                      if (pendingListen && resumed) {
                          pendingListen = false
                          startListening()
                      }
                  }
              }

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) return
                  ttsReady = true
                  applyTtsLanguage()
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {
                          speaking = true
                          speakingSince = System.currentTimeMillis()
                      }

                      override fun onStop(utteranceId: String?, interrupted: Boolean) {
                          speaking = false
                      }

                      override fun onDone(utteranceId: String?) {
                          runOnUiThread { afterSpeaking() }
                      }

                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) {
                          runOnUiThread { afterSpeaking() }
                      }
                  })
                  welcome()
                  handlePendingWake()
              }

              private fun msg(hinglishText: String, english: String) = if (hinglish) hinglishText else english

              /** First open: welcome by name; birthday: confetti + wish; before birthday: daily countdown */
              private fun welcome() {
                  val p = Profile.load(this)
                  val year = Calendar.getInstance().get(Calendar.YEAR)
                  val days = Profile.daysUntil(p.birthday)
                  val bd = Profile.pretty(p.birthday)
                  val todayKey = year * 1000 + Calendar.getInstance().get(Calendar.DAY_OF_YEAR)
                  val soon = when (days ?: -1) {
                      1 -> msg(" Aur haan... kal aapka birthday hai! 🎂 Kal ka poora din sirf aapka hai ✨",
                               " And guess what... tomorrow is your birthday! 🎂")
                      in 2..7 -> msg(" Aur haan... birthday soon! 🎂 $bd ko aapka birthday hai, bas $days din baaki! Countdown shuru ho gaya hai ⏳",
                                     " And... birthday soon! 🎂 Your birthday is on $bd, just $days days to go! Countdown started ⏳")
                      else -> ""
                  }
                  if (days == 0 && prefs.getInt("bdayYear", 0) != year) {
                      prefs.edit().putInt("bdayYear", year).putBoolean("welcomed", true).putInt("countdownDay", todayKey).apply()
                      confetti.burst(220)
                      confetti.postDelayed({ confetti.burst(160) }, 2500)
                      speak(Birthday.randomWish(p, hinglish) + " 💌 " + p.message)
                  } else if (!prefs.getBoolean("welcomed", false)) {
                      prefs.edit().putBoolean("welcomed", true).putInt("countdownDay", todayKey).apply()
                      if (soon.isNotEmpty()) confetti.burst(120)
                      speak(msg(
                          "Hi ${p.name}! 💖 Main Chinu hoon. Mujhe ${p.partner} ne sirf aapke liye banwaya hai.",
                          "Hi ${p.name}! 💖 I'm Chinu. ${p.partner} made me only for you.") + soon)
                  } else if (soon.isNotEmpty() && prefs.getInt("countdownDay", 0) != todayKey) {
                      prefs.edit().putInt("countdownDay", todayKey).apply()
                      speak("${p.name}!" + soon)
                  } else if (pendingListen && resumed) {
                      pendingListen = false
                      startListening()
                  }
              }

              private fun afterSpeaking() {
                  speaking = false
                  if (orb.state == OrbView.State.SPEAKING) setState(OrbView.State.IDLE)
                  if (pendingListen && resumed && !listening) {
                      pendingListen = false
                      orb.postDelayed({ if (resumed && !listening) startListening() }, 350)
                      return
                  }
                  if (convoSwitch.isChecked && resumed && !listening) {
                      orb.postDelayed({ if (resumed && !listening) startListening() }, 350)
                  }
              }

              private fun applyTtsLanguage() {
                  if (!ttsReady) return
                  val locale = if (hinglish) Locale("hi", "IN") else Locale("en", "IN")
                  val r = tts?.setLanguage(locale)
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts?.language = Locale.ENGLISH
                  }
              }

              // ======================= Permissions =======================
              private fun hasPermission(p: String) = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun askPermissions() {
                  val missing = neededPermissions.filterNot { hasPermission(it) }
                  if (missing.isNotEmpty()) requestPermissions(missing.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  updateSetupStatus()
                  if (hasPermission(Manifest.permission.RECORD_AUDIO)) {
                      listenOnResume = false
                      if (prefs.getBoolean("wake", true)) WakeService.start(this)
                      if (wakeCommand == null && !wakeGreet) autoListen()
                  }
              }

              companion object {
                  /** WakeService checks these to decide when to listen */
                  @Volatile
                  var visible = false

                  @Volatile
                  var speaking = false

                  @Volatile
                  var speakingSince = 0L
              }
          }
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/java/com/meraassistant/NameMatcher.kt')"
          cat > 'app/src/main/java/com/meraassistant/NameMatcher.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.icu.text.Transliterator

          /**
           * Matches a spoken name with a contact / app name.
           * - Emojis and symbols in names are ignored ("Mummy ❤️" -> "Mummy")
           * - Hindi script is compared with English script ("मम्मी" == "Mummy")
           */
          object NameMatcher {

              private val toLatinTr: Transliterator? = try {
                  Transliterator.getInstance("Any-Latin; Latin-ASCII")
              } catch (e: Exception) {
                  null
              }

              /** Removes emojis, symbols and extra spaces. Keeps letters (any script), digits and vowel signs. */
              fun clean(s: String): String =
                  s.replace(Regex("[^\\p{L}\\p{N}\\p{M}\\s]"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()

              /** "राहुल ❤️" -> "rahula" */
              fun toLatin(s: String): String {
                  val c = clean(s)
                  val t = toLatinTr?.transliterate(c) ?: c
                  return t.lowercase()
                      .replace(Regex("[^a-z0-9 ]"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
              }

              /** Sound key: "mummy" and "mammi" both -> "mm" */
              fun soundKey(s: String): String {
                  var x = toLatin(s).replace(" ", "")
                  val pairs = listOf(
                      "ph" to "f", "bh" to "b", "kh" to "k", "gh" to "g", "th" to "t",
                      "dh" to "d", "sh" to "s", "ch" to "c", "ck" to "k",
                      "w" to "v", "y" to "i", "z" to "j", "q" to "k"
                  )
                  for ((a, b) in pairs) x = x.replace(a, b)
                  val collapsed = collapse(x)
                  if (collapsed.isEmpty()) return ""
                  val rest = collapsed.substring(1).filter { it !in "aeiou" }
                  return collapse(collapsed.substring(0, 1) + rest)
              }

              private fun collapse(s: String): String {
                  val sb = StringBuilder()
                  for (c in s) if (sb.isEmpty() || sb[sb.length - 1] != c) sb.append(c)
                  return sb.toString()
              }

              private fun similarity(a: String, b: String): Double {
                  if (a.isEmpty() || b.isEmpty()) return 0.0
                  val dp = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      var prev = dp[0]
                      dp[0] = i
                      for (j in 1..b.length) {
                          val tmp = dp[j]
                          dp[j] = minOf(dp[j] + 1, dp[j - 1] + 1, prev + if (a[i - 1] == b[j - 1]) 0 else 1)
                          prev = tmp
                      }
                  }
                  return 1.0 - dp[b.length].toDouble() / maxOf(a.length, b.length)
              }

              private fun wordScore(a: String, b: String): Double {
                  if (a == b) return 1.0
                  val ka = soundKey(a)
                  val kb = soundKey(b)
                  val key = if (ka.isNotEmpty() && ka == kb) 0.9 else similarity(ka, kb) * 0.8
                  return maxOf(key, similarity(a, b))
              }

              /**
               * 1.0  = exact same name
               * 0.95 = every spoken word matches a word of the name
               * lower = fuzzy
               */
              fun score(spoken: String, candidate: String): Double {
                  val s = toLatin(spoken)
                  val c = toLatin(candidate)
                  if (s.isEmpty() || c.isEmpty()) return 0.0
                  if (s == c) return 1.0
                  val sw = s.split(" ").filter { it.isNotBlank() }
                  val cw = c.split(" ").filter { it.isNotBlank() }
                  // har bola gaya shabd naam ke kisi shabd se mile
                  val perWord = sw.map { w -> cw.maxOf { wordScore(w, it) } }
                  val allWords = perWord.minOrNull() ?: 0.0
                  val tokenScore = if (allWords >= 0.85) {
                      // jitne zyada shabd naam ke match hue, utna better
                      0.88 + 0.07 * (sw.size.toDouble() / cw.size).coerceAtMost(1.0)
                  } else allWords * 0.9
                  val whole = wordScore(s.replace(" ", ""), c.replace(" ", ""))
                  return maxOf(tokenScore, whole * 0.95)
              }

              fun <T> best(spoken: String, items: List<T>, threshold: Double = 0.6, label: (T) -> String): T? {
                  var bestItem: T? = null
                  var bestScore = 0.0
                  for (item in items) {
                      val sc = score(spoken, label(item))
                      if (sc > bestScore) {
                          bestScore = sc
                          bestItem = item
                      }
                  }
                  return if (bestScore >= threshold) bestItem else null
              }
          }
