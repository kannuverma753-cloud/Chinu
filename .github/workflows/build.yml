# Chinu — यह एक ही file पूरा app बनाकर APK दे देती है।
# GitHub पर इसे .github/workflows/build.yml नाम से save करें।
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_MERA'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.meraassistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.meraassistant"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          // कोई बाहरी library नहीं — सब कुछ Android के अपने tools से बना है।
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />

              <uses-feature android:name="android.hardware.telephony" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <!-- Android 11+ पर आवाज़ पहचानने, बोलने और apps ढूँढने के लिए ज़रूरी -->
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.google.android.youtube" />
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/ChinuTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- इससे app को "Default digital assistant" के रूप में चुना जा सकता है -->
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <!-- Screenshot, lock, home, back वगैरह के लिए सेवा -->
                  <service
                      android:name=".AssistantService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <!-- 🎂 Birthday reminders -->
                  <receiver
                      android:name=".BirthdayReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <!-- Notification panel वाला Chinu बटन -->
                  <service
                      android:name=".ChinuTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_mic"
                      android:label="@string/tile_label"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/java/com/meraassistant/AssistantService.kt')"
          cat > 'app/src/main/java/com/meraassistant/AssistantService.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          /**
           * System वाले काम करने के लिए Accessibility सेवा:
           * screenshot, phone lock, home, back, notifications, recent apps, power menu।
           * (Android में साधारण app ये काम खुद नहीं कर सकता।)
           */
          class AssistantService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // हमें screen events की ज़रूरत नहीं है
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              /** थोड़ा रुककर screenshot लेता है ताकि Chinu स्क्रीन से हट जाए */
              fun takeScreenshot(delayMs: Long) = global(GLOBAL_ACTION_TAKE_SCREENSHOT, delayMs)

              /** कोई भी system action (lock, home, back...) थोड़ा रुककर */
              fun global(action: Int, delayMs: Long) {
                  handler.postDelayed({ performGlobalAction(action) }, delayMs)
              }

              companion object {
                  @Volatile
                  var instance: AssistantService? = null
                      private set
              }
          }
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/java/com/meraassistant/Birthday.kt')"
          cat > 'app/src/main/java/com/meraassistant/Birthday.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.Manifest
          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import java.util.Calendar

          /**
           * 🎂 Birthday surprise mode:
           * birthday से 2 दिन पहले, 1 दिन पहले, ठीक रात 12 बजे और सुबह 9 बजे notification।
           */
          object Birthday {

              private const val CHANNEL = "birthday"

              val wishesHi = listOf(
                  "Happy Birthday %1\$s! 🎂 भगवान करे आपकी हर ख़्वाहिश पूरी हो, और आपकी मुस्कान हमेशा ऐसे ही चमकती रहे 💖",
                  "जन्मदिन मुबारक हो %1\$s! 🎉 आप %2\$s की दुनिया की सबसे ख़ास इंसान हो ✨",
                  "Happy Birthday %1\$s! 🥳 आज केक भी आपका, दिन भी आपका, और %2\$s का दिल भी आपका 💖",
                  "Many many happy returns of the day, %1\$s! 🎂 ये साल आपके लिए ढेर सारी ख़ुशियाँ और प्यार लेकर आए 🌸",
                  "Happy Birthday मेरी प्यारी %1\$s! 🎈 %2\$s ने मुझसे कहा है कि आज आपको दुनिया की सबसे ख़ुश लड़की बनाना है 😊💖"
              )
              val wishesEn = listOf(
                  "Happy Birthday %1\$s! 🎂 May all your wishes come true and your smile keep shining forever 💖",
                  "Happy Birthday %1\$s! 🎉 You are the most special person in %2\$s's world ✨",
                  "Happy Birthday %1\$s! 🥳 Today the cake is yours, the day is yours, and %2\$s's heart is yours too 💖",
                  "Many happy returns of the day, %1\$s! 🎂 May this year bring you endless happiness 🌸"
              )

              fun randomWish(p: Profile.Data, hindi: Boolean): String =
                  String.format((if (hindi) wishesHi else wishesEn).random(), p.name, p.partner)

              fun createChannel(ctx: Context) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  val ch = NotificationChannel(CHANNEL, "Birthday 🎂", NotificationManager.IMPORTANCE_HIGH)
                  ch.description = "Birthday reminders और wishes"
                  nm.createNotificationChannel(ch)
              }

              /** सारे birthday notifications सेट करता है (जो समय निकल चुका, उन्हें छोड़कर) */
              fun schedule(ctx: Context) {
                  createChannel(ctx)
                  val p = Profile.load(ctx)
                  val bday = Profile.nextDate(p.birthday) ?: return
                  val am = ctx.getSystemService(AlarmManager::class.java)
                  // (id, कितने दिन पहले, कितने बजे)
                  val plan = listOf(Triple(1, -2, 9), Triple(2, -1, 9), Triple(3, 0, 0), Triple(4, 0, 9))
                  for ((id, offset, hour) in plan) {
                      val t = (bday.clone() as Calendar).apply {
                          add(Calendar.DAY_OF_YEAR, offset)
                          set(Calendar.HOUR_OF_DAY, hour)
                      }
                      val pi = PendingIntent.getBroadcast(
                          ctx, id,
                          Intent(ctx, BirthdayReceiver::class.java).putExtra("kind", id),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      if (t.timeInMillis <= System.currentTimeMillis()) {
                          am.cancel(pi)
                          continue
                      }
                      try {
                          val exactOk = Build.VERSION.SDK_INT < Build.VERSION_CODES.S || am.canScheduleExactAlarms()
                          if (exactOk) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.timeInMillis, pi)
                          else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.timeInMillis, pi)
                      } catch (e: SecurityException) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.timeInMillis, pi)
                      }
                  }
              }

              fun notify(ctx: Context, kind: Int) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ctx.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) return
                  createChannel(ctx)
                  val p = Profile.load(ctx)
                  val n = p.name
                  val (title, text) = when (kind) {
                      1 -> "🎂 Birthday soon, $n!" to "बस 2 दिन बाकी! ${p.partner} और Chinu दोनों बहुत excited हैं 💖"
                      2 -> "🎂 कल आपका Birthday है, $n!" to "बस एक रात और... कल का पूरा दिन सिर्फ़ आपका है ✨"
                      3 -> "🎉 Happy Birthday $n! 🎂" to "12 बज गए! ${p.partner} की तरफ़ से ढेर सारा प्यार 💖 Chinu खोलो, आपके लिए एक surprise है!"
                      else -> "🎂 Happy Birthday $n! 💖" to randomWish(p, true)
                  }
                  val open = PendingIntent.getActivity(
                      ctx, 10 + kind,
                      Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val notification = Notification.Builder(ctx, CHANNEL)
                      .setSmallIcon(R.drawable.ic_mic)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  ctx.getSystemService(NotificationManager::class.java).notify(100 + kind, notification)
              }
          }

          /** Alarm आने पर notification दिखाता है; phone restart होने पर फिर से schedule करता है */
          class BirthdayReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      Intent.ACTION_BOOT_COMPLETED, Intent.ACTION_MY_PACKAGE_REPLACED -> Birthday.schedule(context)
                      else -> Birthday.notify(context, intent.getIntExtra("kind", 4))
                  }
              }
          }
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/java/com/meraassistant/ChinuTileService.kt')"
          cat > 'app/src/main/java/com/meraassistant/ChinuTileService.kt' <<'EOF_MERA'
          package com.meraassistant

          import android.annotation.SuppressLint
          import android.app.PendingIntent
          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          /**
           * Notification panel (Quick Settings) में "Chinu" का बटन —
           * एक टच में Chinu खुलकर सुनना शुरू कर देता है।
           */
          class ChinuTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              @SuppressLint("StartActivityAndCollapseDeprecated")
              override fun onClick() {
                  super.onClick()
                  val intent = Intent(this, MainActivity::class.java)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  if (Build.VERSION.SDK_INT >= 34) {
                      val pi = PendingIntent.getActivity(
                          this, 0, intent,
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      startActivityAndCollapse(pi)
                  } else {
                      @Suppress("DEPRECATION")
                      startActivityAndCollapse(intent)
                  }
              }
          }
          EOF_MERA
