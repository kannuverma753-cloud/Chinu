# Chinu — यह एक ही file पूरा app बनाकर APK दे देती है।
# GitHub पर इसे .github/workflows/build.yml नाम से save करें।
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_MERA'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.meraassistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.meraassistant"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "3.0"
                  // Gemini AI key GitHub Secret (GEMINI_KEY) se aati hai, repo mein kabhi nahi dikhti
                  buildConfigField("String", "GEMINI_KEY", "\"${System.getenv("GEMINI_KEY") ?: ""}\"")
              }

              buildFeatures {
                  buildConfig = true
              }

              // Hamesha ek hi signing key, taaki naya APK purane ke upar seedha update ho jaye
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("chinu.jks")
                      storePassword = "chinu12345"
                      keyAlias = "chinu"
                      keyPassword = "chinu12345"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }



          dependencies {
              // Offline "Hi Chinu" wake word engine (no beeps, no internet)
              implementation("com.alphacephei:vosk-android:0.3.47")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
          }
          EOF_MERA
          mkdir -p "$(dirname 'app/chinu.jks')"
          echo '' | base64 -d > 'app/chinu.jks'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
