                          Toast.makeText(this, "🎉 " + Ui.t(this, "Unlocked!", "Khul gaya!"), Toast.LENGTH_SHORT).show()
                          render()
                      } else {
                          input.animate().translationX(dp(10f).toFloat()).setDuration(60).withEndAction {
                              input.animate().translationX(0f).setDuration(60).start()
