                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".ClosetActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize" />
                  <activity
                      android:name=".GameActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize" />
                  <activity
                      android:name=".CoupleActivity"
                      android:exported="false"
