                  android:id="@+id/container"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:paddingLeft="16dp"
                  android:paddingTop="6dp"
                  android:paddingRight="16dp"
                  android:paddingBottom="40dp">

                  <TextView
                      android:id="@+id/backButton"
                      android:layout_width="wrap_content"
                      android:layout_height="44dp"
                      android:background="@drawable/bg_row"
                      android:gravity="center_vertical"
                      android:paddingRight="12dp"
                      android:text="‹ Chinu"
                      android:textColor="@color/blue"
                      android:textSize="17sp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginLeft="4dp"
                      android:fontFamily="sans-serif-medium"
                      android:text="Settings"
                      android:textColor="@color/text"
                      android:textSize="34sp"
                      android:textStyle="bold" />
              </LinearLayout>
          </ScrollView>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/icon_bg" />
              <foreground android:drawable="@drawable/icon_fg" />
              <monochrome android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values-night/colors.xml')"
          cat > 'app/src/main/res/values-night/colors.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Apple-style dark colors -->
              <color name="bg">#FF000000</color>
              <color name="card">#FF1C1C1E</color>
              <color name="text">#FFFFFFFF</color>
              <color name="text2">#FF8E8E93</color>
              <color name="separator">#FF38383A</color>
              <color name="accent">#FF30D158</color>
              <color name="blue">#FF0A84FF</color>
              <color name="chip">#FF1C1C1E</color>
              <color name="pressed">#22FFFFFF</color>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values-night/themes.xml')"
          cat > 'app/src/main/res/values-night/themes.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="ChinuTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:colorAccent">@color/accent</item>
                  <item name="android:colorPrimary">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Apple-style light colors -->
              <color name="bg">#FFF2F2F7</color>
              <color name="card">#FFFFFFFF</color>
              <color name="text">#FF1C1C1E</color>
              <color name="text2">#FF8E8E93</color>
              <color name="separator">#FFE5E5EA</color>
              <color name="accent">#FF34C759</color>
              <color name="blue">#FF007AFF</color>
              <color name="chip">#FFFFFFFF</color>
              <color name="pressed">#14000000</color>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Chinu</string>
              <string name="tile_label">Chinu</string>
              <string name="accessibility_desc">Lets Chinu control your phone by voice: screenshots, lock, home, back, scrolling, notifications and auto-sending WhatsApp messages. Chinu never stores or shares what is on your screen.</string>
              <string name="features">🐦 Say \"Hi Chinu\" anytime — a small card with the green bird pops up on any screen
          🗣️ Every answer is spoken out loud and shown on screen
          🧠 Ask anything (\"Narendra Modi kaun hai?\") in any language
          📞 Calls by name — emojis in contact names are ignored
          💬 WhatsApp messages, sent automatically
          📸 Screenshot of any app (\"WhatsApp ka screenshot lo\")
          🔒 Lock · Home · Back · Notifications · Scroll · Split screen
          🎵 Plays any song by itself — YT Music, Spotify, YouTube or any app\n⏰ Alarms · Timers · Torch · Volume · Music controls
          ⚙️ Turns settings ON/OFF: WiFi · Bluetooth · Hotspot · Data · Location · DND · Airplane · Auto-rotate · Dark mode
          🔋 Battery · Date · Time · Calculator · Navigation · Camera
          🎂 Birthday countdown and midnight wishes
          🌐 12 languages</string>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="ChinuTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:colorAccent">@color/accent</item>
                  <item name="android:colorPrimary">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF_MERA
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_config.xml')"
          cat > 'app/src/main/res/xml/accessibility_config.xml' <<'EOF_MERA'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF_MERA
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF_MERA'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_MERA
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_MERA'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          android.useAndroidX=true
          EOF_MERA
          mkdir -p "$(dirname 'gradle/wrapper/gradle-wrapper.properties')"
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'EOF_MERA'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF_MERA
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF_MERA'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Chinu"
          include(":app")
          EOF_MERA
          # Offline wake-word model (Indian English, 36 MB)
          if [ -z "$SKIP_MODEL" ]; then
            curl -fsSL --retry 4 --retry-delay 5 -o /tmp/vmodel.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
            rm -rf /tmp/vmodel && mkdir -p /tmp/vmodel && unzip -q /tmp/vmodel.zip -d /tmp/vmodel
            mkdir -p app/src/main/assets/model-en-in
            cp -r /tmp/vmodel/*/* app/src/main/assets/model-en-in/
            echo 'chinu-en-in-0.4' > app/src/main/assets/model-en-in/uuid
            ls app/src/main/assets/model-en-in
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk Chinu.apk

      - name: Save error log (only if build failed)
        if: failure()
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" build.log | head -40 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done || true
          git config user.name "chinu-bot"
          git config user.email "chinu-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git reset -q
          git add -f build.log
          git commit -q -m "build log #${{ github.run_number }}"
          git push -f origin build-log

      - uses: actions/upload-artifact@v4
        with:
          name: Chinu-apk
          path: Chinu.apk

      - name: Publish download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.${{ github.run_number }}
          name: Chinu AI v3.${{ github.run_number }}
          make_latest: true
          files: Chinu.apk
